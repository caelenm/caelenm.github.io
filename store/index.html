<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  A static host cannot set response headers, so the policy ships in the page.
  'unsafe-inline' is unavoidable: the whole app is one inline module. What this
  still buys is real — no third-party script can be loaded, no plugin content,
  no <base> rewrite, and no HTML form can post anywhere. connect-src stays open
  to https because the store talks to whichever lightning provider, exchange
  rate source and form endpoint the owner configures.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'unsafe-inline';
  img-src 'self' data: blob: https:;
  connect-src 'self' https:;
  font-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<!-- frame-ancestors is deliberately absent: browsers ignore it in a meta tag.
     To stop the store being framed, set it (or X-Frame-Options) at the host. -->
<meta name="referrer" content="no-referrer">
<title>Store</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --ink:#16151a; --muted:#6b6875; --line:#e5e2dd;
  --accent:#f7931a; --accent-ink:#1a1205;
  --ok:#12805c; --ok-bg:#e6f6f0; --warn:#8a5a00; --warn-bg:#fff6e0; --err:#b3261e; --err-bg:#fdeceb;
  --radius:12px; --shadow:0 1px 2px rgba(20,18,25,.06), 0 8px 24px rgba(20,18,25,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131217; --panel:#1c1b22; --ink:#f0eef2; --muted:#a29eab; --line:#2e2c36;
    --accent-ink:#1a1205;
    --ok:#5fd6a8; --ok-bg:#122a22; --warn:#f0b95c; --warn-bg:#2e2413; --err:#ff9b93; --err-bg:#33191a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131217; --panel:#1c1b22; --ink:#f0eef2; --muted:#a29eab; --line:#2e2c36;
  --ok:#5fd6a8; --ok-bg:#122a22; --warn:#f0b95c; --warn-bg:#2e2413; --err:#ff9b93; --err-bg:#33191a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* header */
header.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:650;font-size:17px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:9px}
.bolt{width:22px;height:22px;flex:none;color:var(--accent)}
.grow{flex:1}
.cartbtn{position:relative;background:var(--ink);color:var(--bg);border:0;border-radius:99px;
  padding:8px 16px;font-weight:600;cursor:pointer;font-size:14px}
.cartbtn .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px;margin-left:7px;font-size:12px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;
  color:var(--muted);font-size:13px;font-weight:500}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

main{padding:32px 0 80px;min-height:60vh}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:18px;letter-spacing:-.01em;margin:28px 0 12px}
h3{font-size:15px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.prod:hover{box-shadow:var(--shadow)}
.prod .ph{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;
  color:var(--muted);overflow:hidden}
.prod .noimg{opacity:.3;display:flex}
.ph{position:relative}
.prod-open{cursor:pointer}
.prod-open:hover{color:var(--accent)}
/* Clicking the middle of the image opens the item; the arrow strips sit above it. */
.gal-open{position:absolute;inset:0;border:0;background:none;cursor:zoom-in;padding:0}
/* Hitbox: full height, a quarter of the width on each side. */
.gal-arm{position:absolute;top:0;bottom:0;width:25%;border:0;background:none;cursor:pointer;
  padding:0;display:flex;align-items:center;opacity:0;transition:opacity .12s}
.gal-arm.left{left:0;justify-content:flex-start}
.gal-arm.right{right:0;justify-content:flex-end}
.ph:hover .gal-arm,.gal-arm:focus-visible{opacity:1}
.gal-arrow{display:flex;align-items:center;justify-content:center;width:30px;height:44px;margin:0 6px;
  background:rgba(20,18,25,.55);color:#fff;border-radius:8px;font-size:22px;line-height:1;
  backdrop-filter:blur(2px)}
.gal-arm:hover .gal-arrow{background:rgba(20,18,25,.8)}
.gal-count{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  background:rgba(20,18,25,.6);color:#fff;border-radius:99px;padding:2px 9px;font-size:11.5px;
  font-variant-numeric:tabular-nums;pointer-events:none}
@media (hover:none){.gal-arm{opacity:.85}}

/* full item view */
dialog.itemdlg{max-width:920px;width:calc(100% - 28px);padding:0;border-radius:16px}
.itemdlg-in{position:relative}
.itemdlg-x{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px}
.itemdlg-x:hover{color:var(--ink)}
.itemdlg-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
@media(max-width:700px){.itemdlg-grid{grid-template-columns:1fr}}
.itemdlg-media .ph{aspect-ratio:1/1;border-radius:16px 0 0 16px}
@media(max-width:700px){.itemdlg-media .ph{border-radius:16px 16px 0 0;aspect-ratio:4/3}}
.itemdlg-media img{width:100%;height:100%;object-fit:cover}
.itemdlg-body{padding:26px 24px 24px;max-height:78vh;overflow:auto}
.itemdlg-title{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
/* A description can contain an unbroken URL or run of characters; wrap it
   rather than letting it push the dialog sideways. */
.itemdlg-desc{white-space:pre-wrap;color:var(--muted);margin:0;overflow-wrap:anywhere}
.imgrow{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;margin-bottom:6px}
.imgrow .thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none}

/* Manual payment is set apart from the catalogue by a faint rule. */
.cashier-manual{padding-bottom:22px;border-bottom:1px solid var(--line)}

/* cashier keypad */
.pad{max-width:420px;margin:0 auto;text-align:center}
.pad-amt{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.pad-sats{color:var(--muted);font-size:17px;margin-top:2px}
.pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
.pad-keys button{padding:20px 0;font-size:20px;font-weight:600;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.pad-keys button:active{background:var(--bg)}
.pad-wide{display:flex;flex-direction:column;gap:10px}
.pad-wide button{padding:16px;font-size:16px;font-weight:650;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .desc{color:var(--muted);font-size:13.5px;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.price{font-weight:650;font-variant-numeric:tabular-nums}
.price .sats{color:var(--muted);font-weight:500;font-size:13px;display:block}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px;
  font-weight:650;cursor:pointer;width:100%;font-size:14px}
.add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.soldout{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* empty state */
.empty{text-align:center;padding:64px 20px;border:2px dashed var(--line);border-radius:16px}
.empty h1{font-size:22px}
.big{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 26px;
  font-weight:650;cursor:pointer;font-size:15px}
.big:disabled{opacity:.5;cursor:not-allowed}

/* forms */
label.f{display:block;margin:0 0 14px}
label.f > span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
label.f > .hint{font-weight:400;color:var(--muted);font-size:12.5px;margin:-3px 0 5px}
input[type=text],input[type=email],input[type=number],input[type=url],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.row{grid-template-columns:1fr}}

/* cart */
.line{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line .thumb{width:56px;height:56px;border-radius:8px;background:var(--bg);object-fit:cover;flex:none}
.line .info{flex:1;min-width:0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:30px;height:30px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.qty button:hover{background:var(--bg);color:var(--ink)}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.totals{display:flex;justify-content:space-between;padding:7px 0;font-variant-numeric:tabular-nums}
.totals.grand{font-size:18px;font-weight:650;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}

/* notices */
.note{border-radius:10px;padding:14px 16px;margin:16px 0;font-size:14px;border:1px solid transparent}
.note b{display:block;margin-bottom:4px}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:currentColor}
.note.err{background:var(--err-bg);color:var(--err);border-color:currentColor}
.note.ok{background:var(--ok-bg);color:var(--ok);border-color:currentColor}
.note.info{background:var(--bg);color:var(--muted);border-color:var(--line)}
.note .body{color:var(--ink)}
.note,.note .body{overflow-wrap:anywhere}
.eml{font-weight:700;overflow-wrap:anywhere}

/* payment */
.pay{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media(max-width:720px){.pay{grid-template-columns:1fr}}
.qr{background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line);display:block;width:100%}
.qr svg{display:block;width:100%;height:auto}
.status{display:flex;align-items:center;gap:9px;font-weight:600;margin:0 0 6px}
.dot{width:9px;height:9px;border-radius:99px;background:var(--warn);flex:none}
.dot.live{animation:pulse 1.4s infinite}
.dot.paid{background:var(--ok);animation:none}
.dot.dead{background:var(--err);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.copyrow{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
/* The invoice must wrap rather than run off the page, and stay selectable —
   so it breaks on any character instead of being clipped to one line. */
.copyrow .val{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;
  overflow-wrap:anywhere;word-break:break-all;white-space:pre-wrap;
  max-height:132px;overflow-y:auto;-webkit-user-select:all;user-select:all}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font-weight:600;
  cursor:pointer;font-size:14px;white-space:nowrap}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
pre.block{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;
  overflow:auto;font-size:12.5px;max-height:340px;white-space:pre-wrap;word-break:break-word}

/* admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 22px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);
  font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px}
.pitem .thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--bg);flex:none}
.pitem .info{flex:1;min-width:0}
.pitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;
  cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);
  padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,9,14,.5)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:650}
.dlg-b{padding:20px;max-height:70vh;overflow:auto}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.draftbar{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid currentColor;
  padding:9px 0;font-size:13.5px;font-weight:500}
.draftbar.stale{background:var(--err-bg);color:var(--err)}
.draftbar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.footlink{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.footlink:hover{color:var(--ink)}
.chk{display:flex;gap:9px;align-items:flex-start;margin:0 0 12px;font-size:14px}
.chk input{margin:3px 0 0;flex:none;width:16px;height:16px;accent-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* attestation badge — bottom right, deliberately small until opened */
.attest{position:fixed;right:14px;bottom:14px;z-index:40;max-width:min(360px,calc(100vw - 28px))}
.attest-pill{display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 11px;
  cursor:pointer;box-shadow:var(--shadow);font-size:12.5px;font-weight:600;
  color:var(--muted);margin-left:auto}
.attest-dot{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none}
.attest.ok .attest-pill{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.attest.ok .attest-dot{background:var(--ok);animation:breathe 3.4s ease-in-out infinite}
.attest.bad .attest-pill{color:var(--err);border-color:currentColor;background:var(--err-bg)}
.attest.warn .attest-pill{color:var(--warn)}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.attest.ok .attest-dot{animation:none}}
.attest-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-top:8px;box-shadow:var(--shadow);font-size:13px;color:var(--ink)}
.attest.bad .attest-panel{border-color:var(--err)}
.attest-warn{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 11px;
  margin:0 0 10px;font-weight:600}
.attest-panel input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--ink)}
.storeicon{width:22px;height:22px;flex:none;border-radius:5px;object-fit:cover;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

@media print{
  header.top,footer,.attest,#draftBar,.noprint{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  pre.block{border:1px solid #999;max-height:none;color:#000;background:#fff}
  .note{border:1px solid #999!important;background:#fff!important;color:#000!important}
  .card{border:1px solid #999;break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap topbar">
    <a class="brand" href="#/">
      <span id="brandIcon"><svg class="bolt" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4.5 13.2h5.9L11 22l8.5-11.2h-5.9z"/></svg></span>
      <span id="brandName">Store</span>
    </a>
    <span class="grow"></span>
    <button class="cartbtn" id="cartBtn" hidden>Cart<span class="n" id="cartCount">0</span></button>
  </div>
</header>

<div id="draftBar" hidden class="draftbar"></div>

<main><div class="wrap" id="view"></div></main>

<div id="attest" class="attest" hidden></div>

<footer><div class="wrap">
  <span id="footName"></span>
  <a href="tos/" class="footlink">Terms of sale</a>
  <span class="grow"></span>
  <span id="rateInfo"></span>
  <button class="ghost" id="adminLink" hidden>Store config</button>
</div></footer>

<script type="module">
"use strict";

/* ══════════════════════════════════════════════════════════════════════════
   QR ENCODER — dependency-free, ISO/IEC 18004. Verified against a reference
   encoder (543 structural comparisons) and round-tripped through a decoder
   (410 encode→decode cases, zero failures).
   ══════════════════════════════════════════════════════════════════════════ */
const QR = (() => {
const ECL={L:0,M:1,Q:2,H:3}, ECL_FMT=[1,0,3,2];
const ECC_CW=[
[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
[-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
const NUM_BLK=[
[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
[-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
[-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
const ALNUM="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";

  const e=new TextEncoder(),a=e.encode(MAGIC),b=e.encode(m);
  return sha2(Uint8Array.from([...varint(a.length),...a,...varint(b.length),...b]))}
function b64bytes(s){
  const bin=atob(String(s).trim().replace(/\s+/g,""));
  return Uint8Array.from(bin,c=>c.charCodeAt(0))}
/** Verify a Bitcoin signed message. The ADDRESS is the trust anchor, so a
    recovered key matching any supported address form for it counts as valid. */
async function verify(message,address,signatureB64){
  const sig=b64bytes(signatureB64);
  if(sig.length!==65)throw new Error(`signature must be 65 bytes, got ${sig.length}`);
  const hdr=sig[0];
  if(hdr<27||hdr>42)throw new Error(`unsupported signature header ${hdr} (taproot/BIP-322 is not supported)`);
  const recid=(hdr-27)&3,compressed=hdr>=31;
  const Q=recover(b2big(await msgHash(message)),
    b2big(sig.slice(1,33)),b2big(sig.slice(33,65)),recid);
  const pub=serPub(Q,compressed);
  const derived={p2pkh:await addrPKH(pub),
    p2sh:compressed?await addrSH(pub):null,
    p2wpkh:compressed?await addrWPKH(pub):null};
  const claimed=String(address).trim();
  return{valid:Object.values(derived).some(a=>a&&a===claimed),derived,compressed}}
const sha256hex=async text=>Array.from(await sha(new TextEncoder().encode(text)),
  b=>b.toString(16).padStart(2,"0")).join("");
return{verify,sha256hex,recover,serPub,b2big,sha};
})();

/**
 * Recover the payee node id from a BOLT-11 invoice.
 *
 * This is what actually binds a payment to a particular wallet. The `n` payee
 * field is optional and usually absent, so in general the node id must be
 * recovered from the invoice's own signature, which covers
 * sha256(hrp || data-without-signature). An invoice therefore cannot be
 * re-attributed to someone else's node without invalidating it.
 *
 * Validated against the `bolt11` package on the BOLT-11 spec vectors and on
 * real invoices; tampering changes the recovered id.
 */
async function payeeNodeId(invoice){
  const CS="qpzry9x8gf2tvdw0s3jn54khce6mua7l";
  const raw=String(invoice).trim().replace(/^lightning:/i,"");
  const lower=raw.toLowerCase();
  if(!lower.startsWith("ln"))throw new Error("not a lightning invoice");
  const sep=lower.lastIndexOf("1");
  if(sep<1)throw new Error("malformed invoice");
  const hrp=lower.slice(0,sep),words=[];
  for(const ch of lower.slice(sep+1)){
    const i=CS.indexOf(ch);
    if(i<0)throw new Error("invalid character in invoice");
    words.push(i)}
  if(words.length<111)throw new Error("invoice too short");

  // 5-bit words to bytes, zero-padding the tail to a byte boundary
  const pad=w=>{let a=0,b=0;const o=[];
    for(const x of w){a=(a<<5)|x;b+=5;while(b>=8){b-=8;o.push((a>>>b)&255)}}
    if(b>0)o.push((a<<(8-b))&255);
    return Uint8Array.from(o)};
  const trunc=w=>{let a=0,b=0;const o=[];
    for(const x of w){a=(a<<5)|x;b+=5;while(b>=8){b-=8;o.push((a>>>b)&255)}}
    return Uint8Array.from(o)};
  const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");

  const payload=words.slice(0,words.length-6);          // drop bech32 checksum
  const sigWords=payload.slice(payload.length-104);
  const signed=payload.slice(0,payload.length-104);

  // An explicit payee field, when present, is authoritative.
  const body=signed.slice(7);
  for(let i=0;i+3<=body.length;){
    const tag=body[i],len=body[i+1]*32+body[i+2];
    const data=body.slice(i+3,i+3+len);
    if(data.length<len)break;
    i+=3+len;
    if(CS[tag]==="n"&&len===53)return{nodeId:hex(trunc(data).slice(0,33)),source:"n-field"}}

  const sig=pad(sigWords);                               // 65 bytes: r||s||recid
  if(sig.length<65)throw new Error("bad signature length");
  const recid=sig[64];
  if(recid>3)throw new Error(`bad recovery id ${recid}`);
  const digest=BTCMSG.b2big(await BTCMSG.sha(Uint8Array.from([
    ...new TextEncoder().encode(hrp),...pad(signed)])));
  const Q=BTCMSG.recover(digest,BTCMSG.b2big(sig.slice(0,32)),BTCMSG.b2big(sig.slice(32,64)),recid);
  return{nodeId:hex(BTCMSG.serPub(Q,true)),source:"signature"}}

/* ══════════════════════════════════════════════════════════════════════════
   DOM helpers — everything is built as nodes, never via innerHTML string
   interpolation, so product/config text can never inject markup.
   ══════════════════════════════════════════════════════════════════════════ */
const el=(tag,props,...kids)=>{
  const n=document.createElement(tag);
  if(props)for(const[k,v]of Object.entries(props)){
    if(v===null||v===false||v===undefined)continue;
    if(k==="class")n.className=v;
    else if(k==="text")n.textContent=v;
    else if(k==="html")n.innerHTML=v;              // only ever fed generated SVG
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    else if(k in n && k!=="list" && k!=="type" && k!=="step")n[k]=v;
    else n.setAttribute(k,v)}
  for(const k of kids.flat()){if(k===null||k===undefined||k===false)continue;
    n.append(k instanceof Node?k:document.createTextNode(String(k)))}
  return n};
const $=id=>document.getElementById(id);
const view=$("view");
const show=(...nodes)=>{view.replaceChildren(...nodes.flat().filter(Boolean));window.scrollTo(0,0)};

/* ══════════════════════════════════════════════════════════════════════════
   CONFIG — published config.json is the source of truth. The editor writes a
   local draft to localStorage; publishing means downloading the file and
   committing it. A visitor editing config only ever affects their own browser.
   ══════════════════════════════════════════════════════════════════════════ */
const MAX_IMAGES=10;
const DESC_LIMIT=300;      // characters shown on a card before "…"
const DRAFT_KEY="satstore.draft.v1";
const CART_KEY="satstore.cart.v1";
const ORDERS_KEY="satstore.orders.v1";

const DEFAULT_CFG={
  version:1,
  store:{name:"My Store",tagline:"",orderEmail:"store@caelen.ca",lightningAddress:"",
    currency:"CAD",accent:"#f7931a",background:"",icon:"",shippingSats:0,shippingNote:"",
    askAddress:true,askPhone:false,askNotes:true,
    formEndpoint:"",formFields:{},
    rateBasis:"index",              // "index" = market rate, "bull" = Bull Bitcoin's own rate
    signingAddress:"",              // BTC address that signs config.json
    canonicalUrl:"",                // where the signed canonical config lives
    trackInventory:false,
    encryptOrders:false,            // encrypt the copy sent to the store
    pgpPublicKey:""},               // armoured OpenPGP public key
  products:[]};

let published=null;   // exactly what config.json contains
let cfg=null;         // published, or the local draft when one exists
let hasDraft=false;
let draftStale=false; // draft was written against a different config.json
let publishedKey="";

/** Cheap non-cryptographic hash, only used to notice that config.json changed. */
const quickHash=s=>{let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return h.toString(16)};
let rate=null;        // { currency, price, source, at }
let rateChecked=false; // a rate lookup has finished, so "unavailable" is honest

const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch{}};

/** Copy own string-keyed fields, skipping keys that would rewrite the target's
    prototype. JSON.parse creates "__proto__" as a real own property, and
    Object.assign then writes it through the setter — which would let a config
    smuggle settings that never appear in the JSON itself. */
function assignSafe(target,source){
  if(!source||typeof source!=="object")return target;
  for(const k of Object.keys(source)){
    if(k==="__proto__"||k==="constructor"||k==="prototype")continue;
    target[k]=source[k]}
  return target}

function normalise(raw){
  const c=structuredClone(DEFAULT_CFG);
  if(raw&&typeof raw==="object"){
    assignSafe(c.store,raw.store&&typeof raw.store==="object"?raw.store:{});
    if(Array.isArray(raw.products))c.products=raw.products.filter(p=>p&&typeof p==="object").map(p=>({
      id:String(p.id||crypto.randomUUID().slice(0,8)),
      name:String(p.name||"Untitled"),
      desc:String(p.desc||""),
      price:Number(p.price)||0,
      // `image` was a single string; keep reading it so old configs still work.
      images:(Array.isArray(p.images)?p.images:[p.image])
        .filter(s=>typeof s==="string"&&s.trim()).slice(0,MAX_IMAGES),
      available:p.available!==false,
      // Buyer names the price (donations, "pay what you want"). The CANONICAL
      // config is the only thing that may grant this — see the verification
      // tool, which reads the flag from the merchant's config, never the order.
      anyPrice:p.anyPrice===true,
      minPrice:Number(p.minPrice)>0?Number(p.minPrice):0,
      noQuantity:p.noQuantity===true,
      options:Array.isArray(p.options)?p.options.filter(o=>o&&o.name&&Array.isArray(o.choices))
        .map(o=>({name:String(o.name),choices:o.choices.map(String).filter(Boolean)})):[]}));
  }
  // Drop blank keys: the editor creates an empty row when you click "Add field",
  // and an unnamed field would otherwise be POSTed to the form endpoint.
  const ff=assignSafe({},
    c.store.formFields&&typeof c.store.formFields==="object"?c.store.formFields:{});
  c.store.formFields={};
  for(const[k,v]of Object.entries(ff))if(String(k).trim())c.store.formFields[k]=v;
  return c}

/* ── inventory ────────────────────────────────────────────────────────────
   Deliberately a separate, UNSIGNED file: stock changes on every sale, and
   requiring a wallet signature per order would make the sidecar unusable.
   It is advisory — a static site cannot sequence two simultaneous buyers. */
let inventory=null;      // { [productId]: number } or null when not in use
let rawConfigText="";    // exact bytes of config.json, for hashing
let configError=null;    // why the config could not be loaded, if it could not
let configFromScript=false;  // loaded via config.js (file:// fallback)

async function loadInventory(){
  if(!cfg.store.trackInventory){inventory=null;return}
  try{
    const r=await fetch("inventory.json",{cache:"no-store"});
    if(!r.ok){inventory=null;return}
    const j=await r.json();
    const q=j&&typeof j==="object"?(j.quantities||j):{};
    inventory={};
    for(const[k,v]of Object.entries(q))if(Number.isFinite(Number(v)))inventory[k]=Math.max(0,Math.floor(Number(v)));
  }catch{ inventory=null }}

const stockOf=id=>inventory?(inventory[id]??null):null;
const inStock=(id,want=1)=>{const s=stockOf(id);return s===null||s>=want};

/** Load config.js, which sets window.__STORE_CONFIG. A <script> tag is the one
    way to read a sibling file when index.html is opened straight off the disk:
    browsers block fetch and XHR on file:// URLs, but still load subresources. */
function loadConfigScript(){
  return new Promise(resolve=>{
    if(window.__STORE_CONFIG)return resolve(window.__STORE_CONFIG);
    const s=document.createElement("script");
    s.src="config.js";
    s.onload=()=>resolve(window.__STORE_CONFIG||null);
    s.onerror=()=>resolve(null);
    document.head.append(s)})}

async function loadConfig(){
  let loaded=null;
  configError=null;configFromScript=false;rawConfigText="";
  try{
    const r=await fetch("config.json",{cache:"no-store"});
    if(r.ok){
      const text=await r.text();
      try{ loaded=JSON.parse(text); rawConfigText=text }
      catch(e){ configError=`config.json is not valid JSON — ${e.message}` }
    }else configError=`config.json could not be read (HTTP ${r.status}).`;
  }catch(e){
    // On file:// this is not a missing file — the browser refuses the read.
    configError=location.protocol==="file:"?"file-protocol"
      :`config.json could not be fetched — ${e.message}`}

  if(!loaded){
    const fromScript=await loadConfigScript();
    if(fromScript){
      loaded=fromScript;configFromScript=true;configError=null;
      rawConfigText=""}          // not the original bytes, so it cannot be attested
  }
  published=normalise(loaded);
  publishedKey=quickHash(JSON.stringify(published));
  const d=lsGet(DRAFT_KEY);
  cfg=published;hasDraft=false;draftStale=false;
  if(d){
    try{
      const parsed=JSON.parse(d);
      const wrapped=parsed&&parsed.__draft===1;
      const draftCfg=normalise(wrapped?parsed.cfg:parsed);
      if(JSON.stringify(draftCfg)!==JSON.stringify(published)){
        cfg=draftCfg;hasDraft=true;
        // A draft written against an older config.json silently replaces a
        // config you just published — including making the store look empty.
        // Flag it loudly instead. Drafts from before this was tracked have
        // unknown provenance, so treat those as stale too.
        draftStale=!wrapped||parsed.basedOn!==publishedKey}
    }catch{ cfg=published;hasDraft=false }
  }
}
const saveDraft=next=>{
  cfg=normalise(next);
  lsSet(DRAFT_KEY,JSON.stringify({__draft:1,basedOn:publishedKey,cfg}));
  hasDraft=JSON.stringify(cfg)!==JSON.stringify(published);
  draftStale=false;                      // it is based on what is published now
  chrome();loadInventory();verifyStore()};

/* ══════════════════════════════════════════════════════════════════════════
   STORE ATTESTATION
   The page hashes the config.json IT was served, then fetches the signature
   from the CANONICAL url baked into that config and checks it with the
   merchant's Bitcoin key. This catches a stale mirror or a clone that edited
   the config (its hash stops matching canonical). It cannot, on its own, stop
   someone who forks everything including the canonical URL — so the signing
   address is always shown, and a buyer who knows it out-of-band can pin it.
   That pin is the only real trust anchor; everything else is tamper-evidence.
   ══════════════════════════════════════════════════════════════════════════ */
const PIN_KEY="satstore.pinnedAddress.v1";
const NODE_KEY="satstore.nodeId.v1";
let attest={state:"off"};

const siblingUrl=(base,name)=>{
  const u=new URL(base);
  u.pathname=u.pathname.replace(/[^/]*$/,name);
  return u.toString()};

async function verifyStore(){
  const s=cfg.store;
  const pinned=(lsGet(PIN_KEY)||"").trim();
  const set=o=>{attest={pinned,signer:s.signingAddress||"",...o};renderBadge()};

  if(hasDraft)return set({state:"draft"});
  if(!s.signingAddress||!s.canonicalUrl||!rawConfigText)return set({state:"off"});

  let localHash;
  try{ localHash=await BTCMSG.sha256hex(rawConfigText) }
  catch(e){ return set({state:"error",detail:e.message}) }

  let canonicalHash,signature;
  try{
    const [hRes,sRes]=await Promise.all([
      fetch(siblingUrl(s.canonicalUrl,"config_hash.txt"),{cache:"no-store"}),
      fetch(siblingUrl(s.canonicalUrl,"config_hash.sig"),{cache:"no-store"})]);
    if(!hRes.ok||!sRes.ok)throw new Error(`canonical files returned ${hRes.status}/${sRes.status}`);
    canonicalHash=(await hRes.text()).trim().toLowerCase().split(/\s+/)[0];
    signature=(await sRes.text()).trim();
  }catch(e){ return set({state:"unreachable",localHash,detail:e.message}) }

  if(!/^[0-9a-f]{64}$/.test(canonicalHash))
    return set({state:"error",localHash,detail:"canonical hash file is not a sha256 hex digest"});

  let sig;
  try{ sig=await BTCMSG.verify(canonicalHash,s.signingAddress,signature) }
  catch(e){ return set({state:"badsig",localHash,canonicalHash,detail:e.message}) }
  if(!sig.valid)
    return set({state:"badsig",localHash,canonicalHash,
      detail:`signature does not come from ${s.signingAddress}`});

  // Signature is good. Does the config we were actually served match it?
  if(localHash!==canonicalHash)
    return set({state:"mismatch",localHash,canonicalHash});

  if(pinned&&pinned!==s.signingAddress)
    return set({state:"pinmismatch",localHash,canonicalHash});

  set({state:"verified",localHash,canonicalHash,pinnedOk:Boolean(pinned)})}

const attestOk=()=>attest.state==="verified";
const attestBad=()=>["mismatch","badsig","pinmismatch"].includes(attest.state);

const ATTEST_TEXT={
  verified:["Store details verified",
    "The products and prices on this page match the configuration the store signed, so they have "+
    "not been altered or left stale. That is all it proves: you must still trust "+
    location.hostname+" itself to run an honest storefront, to hold the stock it lists, and to "+
    "send what you paid for."],
  mismatch:["Store does NOT match canonical","This page is serving a different config.json than the signed canonical one."],
  badsig:["Signature invalid","The canonical signature is not valid for this store's address."],
  pinmismatch:["Different signer than you pinned","This store is signed by an address other than the one you pinned."],
  unreachable:["Canonical source unreachable","Could not fetch the signed canonical config to compare against."],
  draft:["Local draft — not verified","You are viewing unpublished edits, so attestation is skipped."],
  error:["Verification error",""],
  off:["",""]};

function renderBadge(){
  const box=$("attest");
  if(!box)return;
  if(attest.state==="off"){box.hidden=true;return}
  box.hidden=false;
  const [title,detail]=ATTEST_TEXT[attest.state]||["",""];
  const cls=attestOk()?"ok":attestBad()?"bad":"warn";
  box.className="attest "+cls;
  box.replaceChildren(
    el("button",{class:"attest-pill",onclick:()=>toggleAttestPanel()},
      el("span",{class:"attest-dot"}),
      el("span",{text:title})),
    el("div",{class:"attest-panel",hidden:true,id:"attestPanel"},
      el("p",{style:"margin:0 0 10px",text:detail}),
      attest.signer?el("div",{style:"margin-bottom:10px"},
        el("div",{style:"font-size:12px;opacity:.75"},"Signed by"),
        el("code",{class:"mono",style:"word-break:break-all;font-size:12px",text:attest.signer})):null,
      attest.localHash?el("div",{style:"margin-bottom:10px"},
        el("div",{style:"font-size:12px;opacity:.75"},"This page's config hash"),
        el("code",{class:"mono",style:"word-break:break-all;font-size:12px",text:attest.localHash})):null,
      attest.state==="mismatch"&&attest.canonicalHash?el("div",{style:"margin-bottom:10px"},
        el("div",{style:"font-size:12px;opacity:.75"},"Canonical hash"),
        el("code",{class:"mono",style:"word-break:break-all;font-size:12px",text:attest.canonicalHash})):null,
      attestBad()?el("p",{class:"attest-warn"},
        "Do not send payment. Orders placed against a store that does not match its published config will not be fulfilled."):null,
      pinControls()));
}

function pinControls(){
  const cur=(lsGet(PIN_KEY)||"").trim();
  const input=el("input",{type:"text",placeholder:"bc1q… address you got from the store",
    class:"mono",style:"font-size:12px",value:cur});
  return el("div",{style:"border-top:1px solid currentColor;padding-top:10px;margin-top:4px;opacity:.9"},
    el("div",{style:"font-size:12px;margin-bottom:6px"},
      "Only a signing address you obtained ",el("b",null,"elsewhere"),
      " proves this is the right store. Pin it to be warned if it ever changes."),
    input,
    el("div",{style:"display:flex;gap:6px;margin-top:6px"},
      el("button",{class:"btn sec",style:"padding:5px 10px;font-size:12px",onclick:async()=>{
        const v=input.value.trim();
        if(v)lsSet(PIN_KEY,v); else lsDel(PIN_KEY);
        await verifyStore()}},cur?"Update pin":"Pin address"),
      cur?el("button",{class:"btn sec",style:"padding:5px 10px;font-size:12px",onclick:async()=>{
        lsDel(PIN_KEY);await verifyStore()}},"Unpin"):null));
}

function toggleAttestPanel(){
  const p=$("attestPanel");
  if(p)p.hidden=!p.hidden}

/* ── money ────────────────────────────────────────────────────────────── */
const isSats=()=>String(cfg.store.currency||"").toUpperCase()==="SATS";
const fmtFiat=n=>new Intl.NumberFormat(undefined,{style:"currency",currency:cfg.store.currency||"CAD"}).format(n);
const fmtSats=n=>new Intl.NumberFormat().format(Math.round(n))+" sats";

/** Price of one unit, in sats. Needs a live rate when the store prices in fiat.
    `override` carries a buyer-chosen amount for any-price items. */
function unitSats(p,override=null){
  const price=override??p.price;
  if(isSats())return Math.round(price);
  if(!rate)return null;
  return Math.round((price/rate.price)*1e8)}

function priceLabel(p){
  if(p.anyPrice)return[el("span",{text:"You choose"}),
    p.minPrice>0?el("span",{class:"sats",
      text:`from ${isSats()?fmtSats(p.minPrice):fmtFiat(p.minPrice)}`}):null];
  if(isSats())return[el("span",{text:fmtSats(p.price)})];
  const s=unitSats(p);
  return[el("span",{text:fmtFiat(p.price)}),
    // Stay quiet until a rate lookup has actually finished.
    el("span",{class:"sats",text:s!==null?"≈ "+fmtSats(s):rateChecked?"rate unavailable":"…"})]}

/* Bull Bitcoin is the preferred source. Its JSON-RPC endpoint sends
   Access-Control-Allow-Origin:*, returns integer prices with a `precision`
   exponent, and quotes both `indexPrice` (market) and `price` (Bull's own
   rate, which includes their spread). It only covers CAD/USD, hence fallbacks. */
const RATE_SOURCES=[
  {name:"Bull Bitcoin",
    req:c=>["https://www.bullbitcoin.com/api/price",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({jsonrpc:"2.0",id:"1",method:"getRate",
        params:{element:{fromCurrency:"BTC",toCurrency:c}}})}],
    pick:j=>{
      const e=j?.result?.element;
      if(!e)return NaN;
      const raw=cfg.store.rateBasis==="bull"?e.price:(e.indexPrice??e.price);
      return Number(raw)/Math.pow(10,Number(e.precision)||0)}},
  {name:"Kraken",req:c=>[`https://api.kraken.com/0/public/Ticker?pair=XBT${c}`],
    pick:j=>{const k=Object.keys(j?.result||{})[0];return Number(j?.result?.[k]?.c?.[0])}},
  {name:"Coinbase",req:c=>[`https://api.coinbase.com/v2/prices/BTC-${c}/spot`],
    pick:j=>Number(j?.data?.amount)},
  {name:"Blockchain.info",req:()=>["https://blockchain.info/ticker"],
    pick:(j,c)=>Number(j?.[c]?.last)},
];
async function fetchRate(){
  if(isSats())return null;
  const cur=String(cfg.store.currency||"CAD").toUpperCase();
  for(const src of RATE_SOURCES){
    try{
      const [url,init]=src.req(cur);
      const r=await fetch(url,{cache:"no-store",...(init||{})});
      if(!r.ok)continue;
      const v=src.pick(await r.json(),cur);
      if(Number.isFinite(v)&&v>0)return{currency:cur,price:v,source:src.name,at:Date.now()};
    }catch{}
  }
  return null}

/* ── cart ─────────────────────────────────────────────────────────────── */
let cart=[];
const loadCart=()=>{try{cart=JSON.parse(lsGet(CART_KEY)||"[]");if(!Array.isArray(cart))cart=[]}catch{cart=[]}};
const saveCart=()=>{lsSet(CART_KEY,JSON.stringify(cart));chrome()};
// Buyer-chosen amounts are part of a line's identity: two donations of
// different sizes are two lines, not one line of quantity two.
const cartKey=(id,opts,price=null)=>id+"|"+JSON.stringify(opts||{})+"|"+(price??"");
const findProduct=id=>cfg.products.find(p=>p.id===id);
const cartLines=()=>cart.map(l=>({...l,product:findProduct(l.id)})).filter(l=>l.product);
const cartCount=()=>cartLines().reduce((n,l)=>n+l.qty,0);

function addToCart(id,opts,qty=1,price=null){
  const k=cartKey(id,opts,price);
  const line=cart.find(l=>cartKey(l.id,l.opts,l.price??null)===k);
  if(line)line.qty+=qty; else cart.push({id,opts:opts||{},qty,price:price??null});
  saveCart()}
function setQty(k,qty){
  const i=cart.findIndex(l=>cartKey(l.id,l.opts,l.price??null)===k);
  if(i<0)return;
  if(qty<=0)cart.splice(i,1); else cart[i].qty=qty;
  saveCart()}

/** What one unit of a cart line costs, honouring a buyer-chosen amount. */
const linePrice=l=>l.product.anyPrice?(Number(l.price)||0):l.product.price;

function cartTotals(){
  const lines=cartLines();
  let fiat=0,sats=0,priceable=true;
  for(const l of lines){
    const u=unitSats(l.product,l.product.anyPrice?linePrice(l):null);
    if(u===null)priceable=false; else sats+=u*l.qty;
    fiat+=linePrice(l)*l.qty}
  const ship=Math.max(0,Math.round(Number(cfg.store.shippingSats)||0));
  if(lines.length)sats+=ship;
  return{lines,fiat,sats,ship,priceable}}

/* ══════════════════════════════════════════════════════════════════════════
   LIGHTNING — LNURL-pay (LUD-16 address → LUD-06 params → invoice) and
   LUD-21 `verify` polling. All plain CORS-enabled GETs; no backend involved.
   ══════════════════════════════════════════════════════════════════════════ */
function lnurlEndpoint(addr){
  const s=String(addr||"").trim();
  if(!s)throw new Error("No lightning address configured.");
  if(/^https:\/\//i.test(s))return s;
  const m=/^([a-z0-9._%+-]+)@([a-z0-9.-]+\.[a-z]{2,})$/i.exec(s);
  if(!m)throw new Error(`"${s}" is not a valid lightning address.`);
  return `https://${m[2]}/.well-known/lnurlp/${m[1]}`}

async function lnurlParams(addr){
  const r=await fetch(lnurlEndpoint(addr),{cache:"no-store"});
  if(!r.ok)throw new Error(`The merchant's lightning server returned ${r.status}.`);
  const j=await r.json();
  if(j.status==="ERROR")throw new Error(j.reason||"Lightning server rejected the request.");
  if(j.tag!=="payRequest")throw new Error("That address is not a Lightning Address pay endpoint.");
  if(!j.callback)throw new Error("Lightning server returned no callback URL.");
  return j}

async function lnurlInvoice(params,msat,comment){
  const u=new URL(params.callback);
  u.searchParams.set("amount",String(msat));
  const max=Number(params.commentAllowed)||0;
  if(max>0&&comment)u.searchParams.set("comment",comment.slice(0,max));
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok)throw new Error(`Invoice request failed (${r.status}).`);
  const j=await r.json();
  if(j.status==="ERROR")throw new Error(j.reason||"The merchant's server refused to issue an invoice.");
  if(!j.pr)throw new Error("No invoice was returned.");
  return{pr:j.pr,verify:typeof j.verify==="string"?j.verify:null}}

async function checkVerify(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error(`verify ${r.status}`);
  const j=await r.json();
  if(j.status==="ERROR")throw new Error(j.reason||"verify error");
  // LUD-21 returns the preimage alongside settlement; it is the buyer's proof of
  // payment and must reach the merchant in the order summary.
  return readVerifyBody(j)}

/* <paywatch> — extracted verbatim by test/payment.test.mjs; keep self-contained */

/** Interpret a LUD-21 verify body. Providers are inconsistent about the exact
    field and type, so accept the documented forms plus the obvious variants
    rather than silently reporting a paid invoice as unpaid. */
function readVerifyBody(j){
  const truthy=v=>v===true||v===1||v==="true"||v==="1";
  const settled=truthy(j?.settled)||truthy(j?.paid)||truthy(j?.is_paid)||
    (typeof j?.status==="string"&&j.status.toLowerCase()==="paid");
  const raw=typeof j?.preimage==="string"?j.preimage.trim()
    :typeof j?.payment_preimage==="string"?j.payment_preimage.trim():"";
  const preimage=/^[0-9a-f]{64}$/i.test(raw)?raw.toLowerCase():null;
  return{settled,preimage:settled?preimage:null}}

/**
 * Watches a LUD-21 verify URL until the invoice settles.
 *
 * Deliberately stubborn, because the earlier version was not: a burst of
 * network errors must not end the watch, an expired invoice may still settle
 * moments later, and — the big one — mobile browsers freeze timers while the
 * buyer is away in their wallet app, so returning to the tab has to re-poll
 * immediately rather than wait for a throttled timer.
 *
 * All I/O and time is injected so this can be tested with a fake clock.
 */
function createPaymentWatcher(opts){
  // Poll fast while the buyer is actively paying so settlement shows in about a
  // second, then ease off for someone who leaves the tab open.
  const {verifyUrl,expiresAt,check,now,setTimer,clearTimer,
    intervalMs=1500,slowIntervalMs=5000,fastPhaseMs=180000,
    errorBackoffMs=15000,graceMs=120000,errorsBeforeWarning=3,
    onPaid,onTrouble,onRecovered,onStop}=opts;
  const startedAt=now();
  const cadence=()=>now()-startedAt<fastPhaseMs?intervalMs:slowIntervalMs;

  let timer=null,stopped=false,inFlight=false,errors=0,warned=false;

  const clear=()=>{if(timer!==null){clearTimer(timer);timer=null}};
  const stop=reason=>{
    if(stopped)return;
    stopped=true;clear();
    if(onStop)onStop(reason)};

  const schedule=ms=>{
    if(stopped)return;
    clear();
    timer=setTimer(()=>{timer=null;tick()},ms)};

  async function tick(){
    if(stopped||inFlight)return;
    // Keep watching past expiry: a payment can land as the invoice lapses.
    if(now()>expiresAt+graceMs)return stop("expired");
    inFlight=true;
    let result=null,failed=false;
    try{ result=await check(verifyUrl) }
    catch{ failed=true }
    inFlight=false;
    if(stopped)return;

    if(!failed&&result&&result.settled){
      stopped=true;clear();
      onPaid(result.preimage||null);
      return}

    if(failed){
      errors++;
      if(errors>=errorsBeforeWarning&&!warned){
        warned=true;
        if(onTrouble)onTrouble()}
      // Back off, but never give up — the watch outlives transient failures.
      schedule(errorBackoffMs);
      return}

    if(errors>0){
      errors=0;
      if(warned){warned=false;if(onRecovered)onRecovered()}}
    schedule(cadence())}

  return{
    start(){ if(!stopped)schedule(0) },
    /** Poll right now — used when the tab regains focus after a wallet handoff. */
    poke(){ if(stopped||inFlight)return; clear(); tick() },
    stop(){ stop("cancelled") },
    get stopped(){ return stopped },
    get consecutiveErrors(){ return errors }}}

/* </paywatch> */

/** Confirm a preimage really pays this invoice: sha256(preimage) === payment_hash. */
async function preimageMatches(preimageHex,paymentHash){
  const s=String(preimageHex||"").trim().toLowerCase().replace(/^0x/,"");
  if(!/^[0-9a-f]{64}$/.test(s))throw new Error("A preimage is 64 hexadecimal characters.");
  const bytes=Uint8Array.from(s.match(/../g).map(b=>parseInt(b,16)));
  const digest=await crypto.subtle.digest("SHA-256",bytes);
  const got=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");
  return got===String(paymentHash||"").toLowerCase()}

/* ══════════════════════════════════════════════════════════════════════════
   ORDERS
   ══════════════════════════════════════════════════════════════════════════ */
/**
 * The order number is a short hash of the order's own contents — like a git
 * short hash. It is computed BEFORE the invoice is requested, which is what
 * lets it travel in the payment comment; the payment hash does not exist yet
 * at that point. It also makes the number recomputable, so the verification
 * tool can detect an order whose items, totals or customer were edited after
 * the fact.
 *
 * Payment fields are deliberately excluded: they are unknown at numbering time.
 */
function orderCore(o){
  return {
    v:1,
    store:o.storeName||"",
    at:o.at,
    channel:o.channel||"online",
    total_sats:o.totalSats,
    shipping_sats:o.shippingSats||0,
    fiat_total:o.fiatTotal??null,
    fiat_currency:o.fiatCurrency??null,
    items:(o.items||[]).map(i=>({
      id:i.id||"",name:i.name||"",qty:i.qty,
      unit_price:i.unitPrice??null,
      options:i.opts&&Object.keys(i.opts).length
        ?Object.keys(i.opts).sort().map(k=>[k,i.opts[k]]):null})),
    customer:{
      name:o.customer?.name||"",email:o.customer?.email||"",
      phone:o.customer?.phone||"",address:o.customer?.address||"",
      notes:o.customer?.notes||""}}}

const orderNumberFor=async o=>
  (await BTCMSG.sha256hex(JSON.stringify(orderCore(o)))).slice(0,8).toUpperCase();

function orderText(o){
  const L=[];
  L.push(`ORDER ${o.number}`);
  L.push(`${o.storeName} — ${new Date(o.at).toISOString().replace("T"," ").slice(0,16)} UTC`);
  L.push("");
  L.push("ITEMS");
  for(const it of o.items){
    const opts=Object.entries(it.opts||{}).map(([k,v])=>`${k}: ${v}`).join(", ");
    L.push(`  ${it.qty} x ${it.name}${opts?` (${opts})`:""} — ${it.lineLabel}`)}
  if(o.shippingSats>0)L.push(`  Shipping — ${fmtSats(o.shippingSats)}`);
  L.push("");
  L.push(`TOTAL PAID  ${fmtSats(o.totalSats)}`);
  if(o.fiatLabel)L.push(`            ${o.fiatLabel}${o.rateLabel?`  (${o.rateLabel})`:""}`);
  L.push("");
  L.push("PAYMENT PROOF");
  L.push(`  Payment hash: ${o.paymentHash}`);
  if(o.preimage)L.push(`  Preimage:     ${o.preimage}`);
  L.push(`  Paid to:      ${o.lightningAddress}`);
  L.push("");
  L.push("CUSTOMER");
  L.push(`  Name:  ${o.customer.name}`);
  L.push(`  Email: ${o.customer.email}`);
  if(o.customer.phone)L.push(`  Phone: ${o.customer.phone}`);
  if(o.customer.address)L.push(`  Address:\n${o.customer.address.split("\n").map(x=>"    "+x).join("\n")}`);
  if(o.customer.notes)L.push(`  Notes: ${o.customer.notes}`);
  return L.join("\n")}

/** The machine-readable order. This is what the verification tool consumes,
    so its shape is deliberately stable and self-describing. */
function orderJSON(o){
  return {
    schema:"satstore.order/1",
    order_number:o.number,
        placed_at:new Date(o.at).toISOString(),
    channel:o.channel||"online",
    store:{
      name:o.storeName,
      order_email:o.orderEmail,
      lightning_address:o.lightningAddress,
      config_hash:o.configHash||null,
      signing_address:o.signingAddress||null,
      canonical_url:o.canonicalUrl||null,
      attestation:o.attestation||"off"},
    items:o.items.map(i=>({
      id:i.id,name:i.name,quantity:i.qty,
      options:i.opts&&Object.keys(i.opts).length?i.opts:null,
      unit_price:i.unitPrice,line_total:i.lineTotal,currency:i.currency})),
    totals:{
      shipping_sats:o.shippingSats,
      total_sats:o.totalSats,
      fiat_total:o.fiatTotal??null,
      fiat_currency:o.fiatCurrency??null,
      rate:o.rateValue??null,
      rate_source:o.rateSource??null},
    payment:{
      status:o.preimage?"paid_verified":"paid_reported",
      method:"lightning",
      invoice:o.invoice||null,
      payment_hash:o.paymentHash,
      preimage:o.preimage||null,
      verified_by:o.verifiedBy||null},
    customer:{
      name:o.customer.name||null,email:o.customer.email||null,
      phone:o.customer.phone||null,address:o.customer.address||null,
      notes:o.customer.notes||null}};
}
const orderJSONText=o=>JSON.stringify(orderJSON(o),null,2);

/* The email carries the JSON as its payload — that is what the merchant's
   verification tool reads. Compact form, because mail clients truncate long
   mailto: URLs; the on-page copy button always gives the pretty version. */
const emailBody=o=>
  `${orderText(o)}\n\n--- MACHINE-READABLE ORDER (do not edit) ---\n`+
  JSON.stringify(orderJSON(o));

const mailtoFor=o=>`mailto:${encodeURIComponent(o.orderEmail)}`+
  `?subject=${encodeURIComponent(`Order ${o.number} — ${o.storeName}`)}`+
  `&body=${encodeURIComponent(emailBody(o))}`;

/* ══════════════════════════════════════════════════════════════════════════
   ORDER ENCRYPTION (OpenPGP)
   The buyer always keeps a plaintext copy. Only the copy that travels to the
   store is encrypted, to the store's public key. openpgp.js is vendored and
   imported lazily, so a shopper browsing the catalogue never downloads it.
   ══════════════════════════════════════════════════════════════════════════ */
let _openpgp=null;
async function openpgp(){
  if(!_openpgp)_openpgp=await import("./vendor/openpgp.min.mjs");
  return _openpgp}

const pgpConfigured=()=>Boolean(String(cfg.store.pgpPublicKey||"").trim());
const pgpEnabled=()=>Boolean(cfg.store.encryptOrders)&&pgpConfigured();

/** Read an armoured public key, reporting who it belongs to. */
async function readPgpKey(armored){
  const pgp=await openpgp();
  const key=await pgp.readKey({armoredKey:String(armored||"").trim()});
  if(typeof key.isPrivate==="function"&&key.isPrivate())
    throw new Error("That is a PRIVATE key. Paste the PUBLIC key instead — and treat that private key as compromised.");
  const fp=key.getFingerprint().toUpperCase();
  const enc=await key.getEncryptionKey().catch(()=>null);
  if(!enc)throw new Error("This key cannot be used for encryption (no usable encryption key or subkey).");
  return{key,
    fingerprint:fp.replace(/(.{4})(?=.)/g,"$1 "),
    userIds:key.getUserIDs(),
    algorithm:key.getAlgorithmInfo?.()?.algorithm||"unknown",
    expiry:await key.getExpirationTime()}}

async function encryptForStore(text){
  const pgp=await openpgp();
  const {key}=await readPgpKey(cfg.store.pgpPublicKey);
  return pgp.encrypt({
    message:await pgp.createMessage({text}),
    encryptionKeys:key,
    format:"armored"})}

/** Provider-agnostic: POST flat fields as FormData (no preflight) to any
    form-to-email endpoint. Works with Web3Forms, Formspree, FormSubmit,
    Basin, Getform, or your own handler — only the URL changes. */
async function submitToFormEndpoint(o,body){
  const url=String(cfg.store.formEndpoint||"").trim();
  if(!url)return{skipped:true};
  const fd=new FormData();
  for(const[k,v]of Object.entries(cfg.store.formFields||{}))fd.append(k,String(v));
  fd.append("subject",`Order ${o.number} — ${o.storeName}`);
  fd.append("order_number",o.number);
  // When orders are encrypted the customer's details must not travel in the
  // clear alongside the ciphertext, so only the order number identifies it.
  if(!pgpEnabled()){
    fd.append("name",o.customer.name);
    fd.append("email",o.customer.email)}
  fd.append("message",body??orderText(o));
  const r=await fetch(url,{method:"POST",body:fd,headers:{Accept:"application/json"}});
  if(!r.ok)throw new Error(`Form endpoint returned ${r.status}`);
  return{ok:true}}

function rememberOrder(o){
  let all=[];
  try{all=JSON.parse(lsGet(ORDERS_KEY)||"[]")}catch{}
  if(!Array.isArray(all))all=[];
  all.unshift(o);
  lsSet(ORDERS_KEY,JSON.stringify(all.slice(0,25)))}

/* ══════════════════════════════════════════════════════════════════════════
   VIEWS
   ══════════════════════════════════════════════════════════════════════════ */
/** Resolve any CSS colour to relative luminance, so a custom background can
    pick the palette that stays readable on it. */
function luminance(color){
  const d=el("div",{style:`color:${color};display:none`});
  document.body.append(d);
  const rgb=getComputedStyle(d).color;
  d.remove();
  const m=/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(rgb);
  if(!m)return null;
  const [r,g,b]=m.slice(1,4).map(Number).map(v=>{
    v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  return 0.2126*r+0.7152*g+0.0722*b}

function applyTheme(){
  const root=document.documentElement;
  root.style.setProperty("--accent",cfg.store.accent||"#f7931a");
  const bg=String(cfg.store.background||"").trim();
  if(!bg){
    root.removeAttribute("data-theme");
    ["--bg","--panel","--line"].forEach(p=>root.style.removeProperty(p));
    return}
  const lum=luminance(bg);
  if(lum===null)return;
  const dark=lum<0.4, mix=dark?"#ffffff":"#000000";
  root.dataset.theme=dark?"dark":"light";
  root.style.setProperty("--bg",bg);
  root.style.setProperty("--panel",`color-mix(in srgb, ${bg} 91%, ${mix})`);
  root.style.setProperty("--line",`color-mix(in srgb, ${bg} 80%, ${mix})`)}

function applyIcon(){

const NO_IMAGE_SVG='<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 17 5-5 4 4 3-2 4 4"/></svg>';

/** Trim a description for a card. Cuts on a word boundary so it reads cleanly. */
function shortDesc(text){
  const s=String(text||"");
  if(s.length<=DESC_LIMIT)return{text:s,truncated:false};
  const cut=s.slice(0,DESC_LIMIT);
  const space=cut.lastIndexOf(" ");
  return{text:(space>DESC_LIMIT*0.6?cut.slice(0,space):cut).trimEnd()+"…",truncated:true};
}

/**
 * Image gallery with hover arrows and an x/total counter.
 * `onOpen` fires when the middle of the image is clicked — the arrow hitboxes
 * are a quarter of the width on each side and must not trigger it.
 */
function gallery(p,{onOpen=null,start=0}={}){
  const imgs=p.images||[];
  let i=Math.min(start,Math.max(0,imgs.length-1));

  const frame=el("div",{class:"ph"});
  const counter=el("div",{class:"gal-count"});
  const prev=el("button",{class:"gal-arm left","aria-label":"Previous image"},
    el("span",{class:"gal-arrow"},"‹"));
  const next=el("button",{class:"gal-arm right","aria-label":"Next image"},
    el("span",{class:"gal-arrow"},"›"));

  const draw=()=>{
    // replaceChildren stringifies null into the text "null" — unlike el(),
    // which drops it. Filter before handing anything over.
    frame.replaceChildren(...[
      imgs.length
        ?el("img",{src:imgs[i],alt:p.name,loading:"lazy",draggable:false})
        :el("div",{class:"noimg",html:NO_IMAGE_SVG}),
      onOpen?el("button",{class:"gal-open","aria-label":`Open ${p.name}`,
        onclick:e=>{e.stopPropagation();onOpen(i)}}):null,
      imgs.length>1?prev:null,
      imgs.length>1?next:null,
      imgs.length>1?counter:null,
    ].filter(Boolean));
    counter.textContent=`${i+1}/${imgs.length}`};

  const step=d=>e=>{
    e.stopPropagation();e.preventDefault();
    i=(i+d+imgs.length)%imgs.length;
    draw()};
  prev.addEventListener("click",step(-1));
  next.addEventListener("click",step(1));

  draw();
  return{node:frame,get index(){return i}}}

    let price=null;

      price=Number(priceIn.value);
      if(!Number.isFinite(price)||price<=0||price<(p.minPrice||0)){
        priceErr.replaceChildren(el("div",{class:"note err",style:"margin:8px 0 0"},
          el("span",{class:"body",text:p.minPrice>0
            ?`Enter at least ${isSats()?fmtSats(p.minPrice):fmtFiat(p.minPrice)}.`
            :"Enter an amount."})));
        return}
    }
    addToCart(p.id,opts,p.noQuantity?1:qty,price);
    close();go("#/cart")}},maxed?"All in cart":"Add to cart");

  const gal=gallery(p,{start:startIndex});

  dlg.append(el("div",{class:"itemdlg-in"},
    el("button",{class:"itemdlg-x","aria-label":"Close",onclick:close},"✕"),
    el("div",{class:"itemdlg-grid"},
      el("div",{class:"itemdlg-media"},gal.node),

        el("h2",{class:"itemdlg-title",text:p.name}),
        p.desc?el("p",{class:"itemdlg-desc",text:p.desc}):null,
        el("div",{class:"price",style:"font-size:18px;margin:14px 0 4px"},priceLabel(p)),
        stk!==null&&stk>0&&stk<=5?el("div",{class:"soldout",style:"color:var(--warn)",
          text:`only ${stk} left`}):null,
        priceRow,
        optRows,
        qtyRow,
        soldOut?el("div",{class:"soldout",style:"margin-top:14px",text:"Sold out"}):add))));

  document.body.append(dlg);
  dlg.addEventListener("close",()=>dlg.remove());
  dlg.addEventListener("click",e=>{if(e.target===dlg)close()});
  dlg.showModal()}

        el("p",{class:"sub"},

          el("code",{class:"mono"},"file://"),". Browsers block pages on ",
          el("code",{class:"mono"},"file://")," from reading sibling files, so the store looks empty ",
          "even though ",el("code",{class:"mono"},"config.json")," is sitting right next to it and is perfectly valid. ",
          "Nothing is wrong with your config."),

          el("code",{class:"mono"},"config.js")," alongside ",el("code",{class:"mono"},"config.json"),
          ". The page loads that instead when it cannot fetch."),

        el("button",{class:"big",onclick:()=>go("#/admin")},"Open store config"))));

  if(cfg.products.length===0){

  const head=el("div",null,

  const needRate=!isSats()&&!rate;
  // Don't accuse the rate sources of being down before they have had a chance

  const warn=(needRate&&rateChecked)?el("div",{class:"note err"},
    el("b",null,"Prices can't be shown right now."),

      const sel=el("select",{"aria-label":o.name},o.choices.map(c=>el("option",{value:c,text:c})));
      sels[o.name]=sel;
      return el("label",{class:"f",onclick:e=>e.stopPropagation()},el("span",{text:o.name}),sel)});
    const stk=stockOf(p.id);
    const inCart=cartLines().filter(l=>l.id===p.id).reduce((n,l)=>n+l.qty,0);
    const soldOut=p.available===false||(stk!==null&&stk<=0);
    const maxed=stk!==null&&inCart>=stk;
    const open=start=>openItem(p,start);
    const gal=gallery(p,{onOpen:open});

      gal.node,

        el("p",{class:"desc prod-open",text:descText,onclick:()=>open(gal.index)}),
        el("div",{class:"price"},priceLabel(p)),
        stk!==null&&stk>0&&stk<=5?el("div",{class:"soldout",style:"color:var(--warn)",
          text:`only ${stk} left`}):null,
        optRows,
        soldOut?el("div",{class:"soldout",text:"Sold out"})
        // Any-price items always open the full view, where the buyer names the amount.
        :el("button",{class:"add",disabled:needRate||maxed,onclick:()=>{

          addToCart(p.id,opts);go("#/cart")}},
          maxed?"All in cart":p.anyPrice?"Choose an amount":"Add to cart")));
  }));

  // No config button here: the footer already carries one, and a second copy
  // under the products only invited shoppers to poke at it.
  show(head,warn,grid)}
