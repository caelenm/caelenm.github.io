/* ── payment ──────────────────────────────────────────────────────────── */
let payTimer=null,expiryTimer=null,watcher=null,wakeHandler=null;
const stopTimers=()=>{
  clearTimeout(payTimer);clearInterval(expiryTimer);payTimer=expiryTimer=null;
  watcher?.stop();watcher=null;
  if(wakeHandler){
    document.removeEventListener("visibilitychange",wakeHandler);
    window.removeEventListener("focus",wakeHandler);
    window.removeEventListener("pageshow",wakeHandler);
    wakeHandler=null}};

async function viewPay(){
  chrome();stopTimers();
  const cashier=location.hash==="#/cashier-pay";
  const t=cashier?tillTotals():cartTotals();
  if(!t.lines.length)return go(cashier?"#/cashier":"#/cart");
  if(!pendingCustomer)return go("#/checkout");

  const statusDot=el("span",{class:"dot live"});
  const statusText=el("span",{text:"Requesting an invoice…"});
  const panel=el("div",{class:"card"},el("div",{class:"status"},statusDot,statusText));
  show(el("h1",{text:"Pay with Lightning"}),panel);

  const fail=(msg,detail)=>{
    stopTimers();
    statusDot.className="dot dead";statusText.textContent="Couldn't create an invoice";
    panel.append(el("div",{class:"note err"},el("b",null,msg),
      detail?el("span",{class:"body",text:detail}):null),
      el("div",{style:"display:flex;gap:10px"},
        el("button",{class:"btn sec",onclick:()=>go("#/cart")},"Back to cart"),
        el("button",{class:"btn",onclick:()=>viewPay()},"Try again")))};

  let params,inv,decoded;
  // Number the order before asking for an invoice, so the number can travel in
  // the payment comment. `placedAt` is frozen here and reused verbatim by
  // finishOrder, otherwise the number would not recompute.
  const placedAt=Date.now();
  const draftOrder=buildOrder(t,{at:placedAt,channel:cashier?"in-person":"online"});
  const ref=await orderNumberFor(draftOrder);
  try{
    params=await lnurlParams(cfg.store.lightningAddress);
  }catch(e){return fail("The store's lightning address could not be reached.",e.message)}

  const msat=t.sats*1000;
  if(Number(params.minSendable)&&msat<Number(params.minSendable))
    return fail("This order is below the store's minimum payment.",
      `Minimum is ${fmtSats(Number(params.minSendable)/1000)}; this order is ${fmtSats(t.sats)}.`);
  if(Number(params.maxSendable)&&msat>Number(params.maxSendable))
    return fail("This order is above the store's maximum payment.",
      `Maximum is ${fmtSats(Number(params.maxSendable)/1000)}; this order is ${fmtSats(t.sats)}.`);

  try{
    inv=await lnurlInvoice(params,msat,`${cfg.store.name} order ${ref}`);
    decoded=BOLT11.decode(inv.pr);
  }catch(e){return fail("The invoice request failed.",e.message)}

  if(decoded.amountSats!==null&&decoded.amountSats!==t.sats)
    return fail("The invoice amount doesn't match your order.",
      `Invoice is for ${fmtSats(decoded.amountSats)} but your order totals ${fmtSats(t.sats)}. Nothing has been paid.`);

  const uri="lightning:"+inv.pr.toUpperCase();
  const qrBox=el("div",{class:"qr",html:QR.svg(QR.encode(inv.pr.toUpperCase(),"M"))});
  const countdown=el("span",{class:"mono"});

  const copyBtn=(label,value)=>el("button",{class:"btn sec",onclick:async e=>{
    try{await navigator.clipboard.writeText(value);e.target.textContent="Copied";
      setTimeout(()=>{e.target.textContent=label},1400)}catch{e.target.textContent="Press ⌘/Ctrl+C"}}},label);

  const manual=el("div");
  const right=el("div",null,
    el("div",{class:"status"},statusDot,statusText),
    el("div",{style:"font-size:30px;font-weight:680;letter-spacing:-.02em;margin:2px 0 2px",text:fmtSats(t.sats)}),
    !isSats()&&rate?el("div",{style:"color:var(--muted);font-size:13.5px",
      text:`${fmtFiat(t.fiat+0)} at 1 BTC = ${fmtFiat(rate.price)}`}):null,
    el("div",{style:"color:var(--muted);font-size:13.5px;margin-top:8px"},"Expires in ",countdown),
    el("div",{class:"copyrow"},
      el("div",{class:"val mono",text:inv.pr}),
      copyBtn("Copy invoice",inv.pr)),
    el("a",{href:uri,class:"btn acc",style:"display:inline-block;text-decoration:none;text-align:center"},"Open in wallet"),
    el("p",{style:"color:var(--muted);font-size:13px;margin:14px 0 0",
      text:`Order ${ref} — sent as the payment comment, so it appears in the store's wallet.`}),
    manual);

  panel.replaceChildren(el("div",{class:"pay"},el("div",null,qrBox),right));

  /* countdown */
  const tick=()=>{
    const left=Math.max(0,decoded.expiresAt-Date.now());
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    countdown.textContent=`${m}:${String(s).padStart(2,"0")}`;
    if(left<=0){
      // Stop only the countdown. The watcher keeps checking through its grace
      // window, because a payment can settle just as the invoice lapses.
      clearInterval(expiryTimer);expiryTimer=null;
      statusDot.className="dot dead";
      statusText.textContent=watcher&&!watcher.stopped?"Invoice expired — still checking":"Invoice expired";
      if(!manual.querySelector(".note.err"))manual.prepend(el("div",{class:"note err"},
        el("b",null,"This invoice expired."),
        el("span",{class:"body"},"If you did not pay, nothing was charged. If you paid just as it lapsed, the page is still checking — give it a moment, or confirm with your preimage below. "),
        el("button",{class:"btn sec",style:"margin-top:10px",onclick:()=>viewPay()},"Get a new invoice")))}};
  tick();expiryTimer=setInterval(tick,1000);

  const settle=async(preimage,verifiedBy)=>{
    stopTimers();
    statusDot.className="dot paid";statusText.textContent="Paid";
    await finishOrder(t,decoded,preimage,ref,
      {at:placedAt,invoice:inv.pr,verifiedBy,channel:cashier?"in-person":"online"})};

  /* LUD-21 live polling, or manual preimage entry when unsupported */
  if(inv.verify){
    statusText.textContent="Waiting for payment…";
    watcher=createPaymentWatcher({
      verifyUrl:inv.verify,
      expiresAt:decoded.expiresAt,
      check:checkVerify,
      now:()=>Date.now(),
      setTimer:(fn,ms)=>setTimeout(fn,ms),
      clearTimer:id=>clearTimeout(id),
      onPaid:preimage=>settle(preimage,"lud21-verify"),
      onTrouble:()=>{
        statusText.textContent="Checking payment status…";
        statusDot.className="dot";
        showManual("The store's payment-status server isn't responding right now. The page keeps retrying — but if you've already paid, you can confirm it here instead.")},
      onRecovered:()=>{
        statusText.textContent="Waiting for payment…";
        statusDot.className="dot live"}});
    watcher.start();

    // Buyers leave for their wallet app, and mobile browsers freeze timers in
    // background tabs. Re-check the moment they come back.
    wakeHandler=()=>{if(!document.hidden)watcher?.poke()};
    document.addEventListener("visibilitychange",wakeHandler);
    window.addEventListener("focus",wakeHandler);
    window.addEventListener("pageshow",wakeHandler);
  }else{
    statusText.textContent="Waiting for payment";
    statusDot.className="dot";
    showManual("This wallet provider doesn't support live payment status, so the page can't detect your payment on its own.");
  }

  function showManual(reason){
    if(manual.dataset.on)return;
    manual.dataset.on="1";
    const input=el("input",{type:"text",placeholder:"64-character preimage",class:"mono"});
    const msg=el("div",{hidden:true});
    manual.append(el("div",{class:"note info",style:"margin-top:20px"},
      el("b",null,"Confirm your payment"),
      el("div",{class:"body"},
        el("p",{style:"margin:0 0 10px",text:reason}),
        el("p",{style:"margin:0 0 10px"},
          "After paying, your wallet shows a ",el("b",null,"preimage"),
          " (sometimes called the payment proof or receipt). Paste it here and the page will check it against this invoice."),
        el("label",{class:"f"},el("span",{text:"Payment preimage"}),input),
        msg,
        el("button",{class:"btn acc",onclick:async()=>{
          msg.hidden=false;
          try{
            if(await preimageMatches(input.value,decoded.paymentHash)){
              msg.replaceChildren(el("div",{class:"note ok"},el("span",{class:"body",text:"Verified. Thank you!"})));
              await settle(input.value.trim().toLowerCase(),"preimage-sha256");
            }else{
              msg.replaceChildren(el("div",{class:"note err"},
                el("span",{class:"body",text:"That preimage does not match this invoice."})));}
          }catch(e){
            msg.replaceChildren(el("div",{class:"note err"},el("span",{class:"body",text:e.message})))}
        }},"Verify payment"))))}
}

/* ── paid / order handoff ─────────────────────────────────────────────── */
let lastOrder=null;

/** Everything about an order that is known before payment. Shared by the
    numbering step and by finishOrder, so both hash identical content. */
function buildOrder(t,extra={}){
  return{
    at:extra.at??Date.now(),
    channel:extra.channel||"online",
    storeName:cfg.store.name||"Store",
    orderEmail:cfg.store.orderEmail,
    lightningAddress:cfg.store.lightningAddress,
    configHash:attest.localHash||null,
    signingAddress:cfg.store.signingAddress||null,
    canonicalUrl:cfg.store.canonicalUrl||null,
    attestation:attest.state||"off",
    items:t.lines.map(l=>({id:l.id,name:l.product.name,qty:l.qty,opts:l.opts,
      unitPrice:linePrice(l),lineTotal:linePrice(l)*l.qty,
      currency:isSats()?"SATS":cfg.store.currency,
      lineLabel:isSats()?fmtSats(linePrice(l)*l.qty):fmtFiat(linePrice(l)*l.qty)})),
    shippingSats:t.ship,
    totalSats:t.sats,
    fiatTotal:isSats()?null:Number(t.fiat.toFixed(2)),
    fiatCurrency:isSats()?null:cfg.store.currency,
    rateValue:rate?rate.price:null,
    rateSource:rate?rate.source:null,
    fiatLabel:isSats()?null:fmtFiat(t.fiat),
    rateLabel:rate?`1 BTC = ${fmtFiat(rate.price)} via ${rate.source}`:null,
    customer:pendingCustomer||{name:"",email:"",phone:"",address:"",notes:""}}}

async function finishOrder(t,decoded,preimage,ref,extra={}){
  const o={
    ...buildOrder(t,extra),
    number:ref,
    invoice:extra.invoice||null,
    verifiedBy:extra.verifiedBy||null,
    paymentHash:decoded.paymentHash,
    preimage:preimage||null};
  lastOrder=o;
  rememberOrder(o);
  if(o.channel==="in-person"){till={};manualAmount=null} else {cart=[];saveCart()}
  go("#/done")}

function viewDone(){
  chrome();
  const o=lastOrder;
  if(!o)return show(el("h1",{text:"No recent order"}),
    el("p",{class:"sub",text:"Nothing to show here."}),
    el("button",{class:"btn sec",onclick:()=>go("#/")},"Back to the store"));

  const text=orderText(o);
  const json=orderJSONText(o);
  const mkCopy=(label,value,cls="btn acc")=>el("button",{class:cls+" noprint",onclick:async e=>{
    try{await navigator.clipboard.writeText(value);e.target.textContent="Copied";
      setTimeout(()=>{e.target.textContent=label},1800)}
    catch{e.target.textContent="Select the text below and copy"}}},label);
  const copyBtn=mkCopy("Copy order JSON",json);
  const printBtn=el("button",{class:"btn sec noprint",onclick:()=>window.print()},"Print / save PDF");

  const mailUrl=mailtoFor(o);
  const mailTooLong=mailUrl.length>1900;   // mail clients silently truncate long mailto: URLs

  const receiptQR=el("div");
  const qrBtn=el("button",{class:"btn sec noprint",onclick:()=>{
    if(receiptQR.dataset.on){receiptQR.replaceChildren();delete receiptQR.dataset.on;return}
    receiptQR.dataset.on="1";
    // Compact receipt: enough to prove and re-check the payment later.
    const compact=JSON.stringify({n:o.number,h:o.paymentHash,p:o.preimage||null,
      s:o.totalSats,t:new Date(o.at).toISOString(),st:o.storeName});
    try{
      receiptQR.replaceChildren(el("div",{style:"max-width:250px;margin-top:12px"},
        el("div",{class:"qr",html:QR.svg(QR.encode(compact,"M"))}),
        el("p",{style:"font-size:12px;color:var(--muted);margin:8px 0 0",
          text:"Scan to keep your payment proof."})));
    }catch{
      receiptQR.replaceChildren(el("div",{class:"note err"},
        el("span",{class:"body",text:"Receipt is too large to encode as a QR code."})))}
  }},"Show receipt QR");

  const sendState=el("div");
  const autoSent=Boolean(String(cfg.store.formEndpoint||"").trim());
  const secure=el("div");

  // Encrypt the copy that goes to the store. The buyer's own copy above stays
  // in plain text; this only protects the message in transit.
  const sendBody=pgpEnabled()
    ?encryptForStore(json)
    :Promise.resolve(null);

  if(pgpEnabled())secure.append(el("div",{class:"note info"},
    el("span",{class:"body",text:"Encrypting your order for the store…"})));

  sendBody.then(cipher=>{
    if(cipher)renderSecure(cipher);
    if(autoSent){
      sendState.replaceChildren(el("div",{class:"note info"},
        el("span",{class:"body",text:"Sending your order to the store…"})));
      return submitToFormEndpoint(o,cipher??undefined)
        .then(r=>{sendState.replaceChildren(r.skipped?el("span"):el("div",{class:"note ok"},
          el("b",null,"Your order was sent to the store automatically."),
          el("span",{class:"body",text:cipher
            ?"It was encrypted first, so only the store can read it. Keep your order number for reference."
            :"You don't need to email anything. Keep your order number for reference."})))})
        .catch(()=>{sendState.replaceChildren(el("div",{class:"note warn"},
          el("b",null,"Automatic delivery failed."),
          el("span",{class:"body",text:"Please send the order using the button below so the store receives it."})))})}
  }).catch(e=>{
    secure.replaceChildren(el("div",{class:"note err"},
      el("b",null,"Your order could not be encrypted."),
      el("div",{class:"body"},
        el("p",{style:"margin:0 0 8px",text:e.message}),
        el("p",{style:"margin:0"},
          "Nothing was sent. Send the plain order below instead, and tell the store their encryption key is broken."))));
    if(autoSent)sendState.replaceChildren()});

  function renderSecure(cipher){
    const copyCipher=el("button",{class:"btn acc noprint",onclick:async e=>{
      try{await navigator.clipboard.writeText(cipher);e.target.textContent="Copied — now paste it into your email";
        setTimeout(()=>{e.target.textContent="Copy encrypted order"},2600)}
      catch{e.target.textContent="Select the block below and copy"}}},"Copy encrypted order");

    // The ciphertext is far too long for a mailto: body, so put it on the
    // clipboard and open a short email for the buyer to paste into.
    const mailEncrypted=el("a",{class:"btn sec noprint",style:"text-decoration:none",
      href:`mailto:${encodeURIComponent(o.orderEmail)}`+
        `?subject=${encodeURIComponent(`Encrypted order ${o.number} — ${o.storeName}`)}`+
        `&body=${encodeURIComponent(
          `Order ${o.number}\n\nThe encrypted order is on my clipboard — pasting it below.\n\n`)}`,
      onclick:async()=>{try{await navigator.clipboard.writeText(cipher)}catch{}}},
      "Email it (copies first)");

    secure.replaceChildren(
      el("div",{class:"note ok"},
        el("b",null,"Your order was encrypted for the store."),
        el("span",{class:"body"},
          "Only ",el("span",{class:"eml",text:o.orderEmail}),
          " can read it. Your own plain copy is further down this page — keep it.")),
      autoSent?null:el("div",{class:"note warn"},
        el("b",null,"One more step — send the encrypted order."),
        el("div",{class:"body"},
          el("p",{style:"margin:0 0 8px"},
            "Copy the block below and email it to ",
            el("span",{class:"eml",text:o.orderEmail}),". ",
            el("b",null,"Your order is not in the queue until you do.")),
          el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},copyCipher,mailEncrypted))),
      el("h2",{text:"Encrypted order"}),
      el("pre",{class:"block mono",text:cipher}),
      autoSent?el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},copyCipher,mailEncrypted):null)}

  show(
    el("div",{class:"note ok",style:"margin-top:0"},
      el("b",null,"Paid — thank you!"),
      el("span",{class:"body",text:"Your payment has been confirmed on the Lightning Network."})),
    el("h1",null,"Order ",el("span",{class:"mono",text:o.number})),
    el("p",{class:"sub",text:`${fmtSats(o.totalSats)}${o.fiatLabel?` · ${o.fiatLabel}`:""} · ${new Date(o.at).toLocaleString()}`}),
    sendState,
    secure,
    (autoSent||pgpEnabled())?null:el("div",{class:"note warn"},
      el("b",null,"One more step — send your order to the store."),
      el("div",{class:"body"},
        el("p",{style:"margin:0 0 8px"},
          "The payment went through, but the store has no way to learn what you ordered. Email the details below to ",
          el("span",{class:"eml",text:o.orderEmail})),
        el("p",{style:"margin:0 0 12px"},
          el("b",null,"Your order is not in the queue until you do.")),
        mailTooLong?el("p",{style:"margin:0 0 10px;font-size:13px"},
          el("b",null,"This order is long — "),
          "your mail app may cut it short. Use ",el("b",null,"Copy order JSON"),
          " and paste it into the email instead."):null,
        el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},
          el("a",{class:"btn acc noprint",href:mailUrl,style:"text-decoration:none"},"Email my order"),
          copyBtn))),
    el("h2",{text:"Order summary"}),
    el("pre",{class:"block mono",text:text}),
    el("h2",{text:pgpEnabled()?"Your copy (plain text — keep this)":"Order JSON"}),
    el("p",{class:"sub",style:"margin-bottom:10px"},
      pgpEnabled()
        ?"Yours to keep. The store receives only the encrypted version above."
        :"This is the authoritative record. The store checks it with the order verification tool."),
    el("pre",{class:"block mono",text:json}),
    el("div",{style:"display:flex;gap:10px;flex-wrap:wrap;margin-top:4px"},
      (autoSent&&!pgpEnabled())?el("a",{class:"btn sec noprint",href:mailUrl,style:"text-decoration:none"},"Email a copy"):null,
      mkCopy("Copy order JSON",json,pgpEnabled()||autoSent?"btn sec":"btn acc"),
      printBtn,qrBtn),
    receiptQR,
    el("p",{style:"margin-top:26px"},
      el("button",{class:"btn sec noprint",onclick:()=>go("#/")},"Back to the store")))}

/* ── inventory editor ─────────────────────────────────────────────────── */
function adminInventory(d){
  const draft={...(inventory||{})};
  const toggle=el("input",{type:"checkbox"});
  toggle.checked=Boolean(d.store.trackInventory);
  toggle.addEventListener("change",()=>{
    d.store.trackInventory=toggle.checked;saveDraft(d);viewAdmin()});

  const rows=el("div",{class:"plist"});
  const download=()=>{
    const body=JSON.stringify({schema:"satstore.inventory/1",
      updated_at:new Date().toISOString(),quantities:draft},null,2);
    const url=URL.createObjectURL(new Blob([body],{type:"application/json"}));
    const a=el("a",{href:url,download:"inventory.json"});
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000)};

  if(d.store.trackInventory){
    // Items sold singly or at a buyer-chosen price have no meaningful stock count.
    const counted=d.products.filter(p=>!p.noQuantity);
    rows.replaceChildren(...counted.map(p=>{
      const n=el("input",{type:"number",min:"0",step:"1",style:"width:110px",
        value:String(draft[p.id]??0)});
      n.addEventListener("change",()=>{draft[p.id]=Math.max(0,Math.floor(Number(n.value)||0))});
      return el("div",{class:"pitem"},
        el("div",{class:"info"},el("div",{class:"nm",text:p.name}),
          el("code",{class:"mono",style:"font-size:12px;color:var(--muted)",text:p.id})),
        n)}));
    if(!d.products.length)rows.append(el("p",{class:"sub",text:"Add products first."}))}

  return el("div",null,
    el("div",{class:"card"},
      el("label",{class:"chk"},toggle,
        el("span",null,"Track inventory quantities")),
      el("div",{class:"hint"},
        "Shows “only N left”, hides sold-out items, and caps what a buyer can add to their cart.")),
    d.store.trackInventory?el("div",null,
      el("div",{class:"note info"},
        el("b",null,"Stock lives in inventory.json, not config.json."),
        el("span",{class:"body"},
          "It is deliberately outside the signed config, because it changes on every sale — "+
          "otherwise you would have to re-sign with your wallet after each order. "+
          "That also means stock counts are not attested, and a static site cannot stop "+
          "two people buying the last item at the same moment. Your wallet is the real record.")),
      el("h2",{text:"Quantities"}),rows,
      el("p",{style:"margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"},
        el("button",{class:"btn acc",onclick:download},"Download inventory.json"),
        el("button",{class:"btn sec",onclick:()=>{
          navigator.clipboard?.writeText(JSON.stringify(draft,null,2)).catch(()=>{})}},"Copy quantities")),
      el("p",{class:"sub",style:"margin-top:10px"},
        "Or update stock from the command line after a sale with ",
        el("code",{class:"mono"},"updateinventory.sh"),".")):null)}

/* ── order verification tool ──────────────────────────────────────────── */
function adminVerifyOrder(){
  const urlIn=el("input",{type:"text",placeholder:"https://raw.githubusercontent.com/you/store/main/config.json",
    value:cfg.store.canonicalUrl||""});
  const nodeIn=el("input",{type:"text",class:"mono",style:"font-size:12.5px",
    placeholder:"02… or 03… (66 hex characters)",
    value:lsGet(NODE_KEY)||""});
  const nodeHint=el("div");
  const orderIn=el("textarea",{placeholder:"Paste the order JSON from the customer's email",
    style:"min-height:190px;font-family:ui-monospace,monospace;font-size:12.5px"});
  const out=el("div");

  const line=(ok,label,detail)=>el("div",{style:"display:flex;gap:9px;padding:7px 0;align-items:flex-start"},
    el("span",{style:`flex:none;font-weight:700;color:var(--${ok===null?"muted":ok?"ok":"err"})`,
      text:ok===null?"—":ok?"✓":"✕"}),
    el("div",null,el("div",{style:"font-weight:600",text:label}),
      detail?el("div",{style:"color:var(--muted);font-size:13px;word-break:break-all",text:detail}):null));

  const run=async()=>{
    out.replaceChildren(el("div",{class:"note info"},el("span",{class:"body",text:"Checking…"})));
    let order;
    try{ order=JSON.parse(orderIn.value) }
    catch(e){ return out.replaceChildren(el("div",{class:"note err"},
      el("b",null,"That is not valid JSON."),el("span",{class:"body",text:e.message}))) }

    const checks=[];
    const schemaOk=order?.schema==="satstore.order/1";
    checks.push(line(schemaOk,"Order schema recognised",order?.schema||"missing schema field"));
    if(!schemaOk)return out.replaceChildren(el("div",{class:"card"},...checks));

    // 1. canonical config
    let canonical=null,canonicalText="",canonicalHash=null;
    try{
      const r=await fetch(urlIn.value.trim(),{cache:"no-store"});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      canonicalText=await r.text();
      canonical=JSON.parse(canonicalText);
      canonicalHash=await BTCMSG.sha256hex(canonicalText);
      checks.push(line(true,"Canonical config fetched",`sha256 ${canonicalHash}`));
    }catch(e){
      checks.push(line(false,"Could not fetch the canonical config",e.message));
      return out.replaceChildren(el("div",{class:"card"},...checks))}

    // 2. the order was placed against that exact config
    const claimed=order.store?.config_hash;
    checks.push(line(claimed?claimed===canonicalHash:null,
      claimed?(claimed===canonicalHash?"Order was placed against the canonical config"
        :"Order was placed against a DIFFERENT config")
       :"Order carries no config hash (store attestation was off)",
      claimed&&claimed!==canonicalHash?`order says ${claimed}`:""));

    // 2b. the order number is a hash of the order's own contents, so recomputing
    //     it catches items, totals or customer details edited after the fact.
    try{
      const recomputed=await orderNumberFor({
        at:Date.parse(order.placed_at),
        channel:order.channel,
        storeName:order.store?.name,
        totalSats:order.totals?.total_sats,
        shippingSats:order.totals?.shipping_sats,
        fiatTotal:order.totals?.fiat_total,
        fiatCurrency:order.totals?.fiat_currency,
        items:(order.items||[]).map(i=>({id:i.id,name:i.name,qty:i.quantity,
          unitPrice:i.unit_price,opts:i.options||{}})),
        customer:order.customer||{}});
      const same=recomputed===String(order.order_number||"").toUpperCase();
      checks.push(line(same,
        same?"Order number matches the order's contents"
          :"Order number does NOT match its contents — the order was edited",
        same?recomputed:`recomputed ${recomputed}, order says ${order.order_number}`));
    }catch(e){ checks.push(line(null,"Order number could not be recomputed",e.message)) }

    // 3. the address named in the order. This is a claim written by the buyer's
    //    browser, not evidence — the node id check below is the real binding.
    const lnOrder=order.store?.lightning_address;
    const lnCanon=canonical?.store?.lightningAddress;
    checks.push(line(Boolean(lnOrder&&lnCanon&&lnOrder===lnCanon),
      lnOrder===lnCanon?"Order names the canonical lightning address"
        :"Order names a DIFFERENT lightning address",
      lnOrder===lnCanon
        ?`${lnCanon} — written by the buyer's browser, so a claim rather than proof`
        :`order: ${lnOrder||"—"} / canonical: ${lnCanon||"—"}`));

    // 4. preimage really pays the stated invoice
    const ph=order.payment?.payment_hash,pre=order.payment?.preimage;
    if(pre){
      try{
        const ok=await preimageMatches(pre,ph);
        checks.push(line(ok,ok?"Preimage proves this invoice was paid"
          :"Preimage does NOT match the payment hash",`payment_hash ${ph}`));
      }catch(e){ checks.push(line(false,"Preimage is malformed",e.message)) }
    }else{
      checks.push(line(null,"No preimage supplied",
        "Payment was reported by the store's own server, not proven by the buyer. Check your wallet for this payment hash."))}

    // 5. invoice must decode, agree with hash + amount, and — the binding that
    //    actually matters — have been issued by YOUR node.
    if(order.payment?.invoice){
      try{
        const dec=BOLT11.decode(order.payment.invoice);
        checks.push(line(dec.paymentHash===ph,
          dec.paymentHash===ph?"Invoice matches the payment hash":"Invoice does not match the payment hash",""));
        const want=order.totals?.total_sats;
        checks.push(line(dec.amountSats===null||dec.amountSats===want,
          dec.amountSats===want?"Invoice amount matches the order total"
            :"Invoice amount does NOT match the order total",
          `invoice ${dec.amountSats} sats / order ${want} sats`));

        const expected=nodeIn.value.trim().toLowerCase();
        try{
          const {nodeId,source}=await payeeNodeId(order.payment.invoice);
          if(!expected){
            checks.push(line(null,"Invoice was issued by this node",
              `${nodeId} (recovered from the invoice ${source==="n-field"?"payee field":"signature"}). `+
              "Paste your own node id above to have this checked automatically."));
          }else{
            const match=nodeId===expected;
            checks.push(line(match,
              match?"Invoice was issued by YOUR node"
                :"Invoice was issued by a DIFFERENT node — payment did not reach you",
              match?nodeId:`invoice: ${nodeId}\nyours:   ${expected}`));
          }
        }catch(e){
          checks.push(line(false,"Could not recover the paying node from the invoice",e.message))}
      }catch(e){ checks.push(line(false,"Invoice could not be decoded",e.message)) }
    }else{
      checks.push(line(false,"No invoice supplied",
        "Without the invoice the payment cannot be tied to your node. Only the buyer's own claims can be checked."));
    }

    // 6. prices charged match the canonical catalogue
    // Whether a buyer may name their own price is read from the CANONICAL
    // config, never from the order. An order cannot claim a fixed-price item
    // was pay-what-you-want; the merchant's signed catalogue decides.
    const cat=Object.fromEntries((canonical?.products||[]).map(p=>[p.id,p]));
    const bad=[];
    let chosen=0;
    for(const it of order.items||[]){
      const p=cat[it.id];
      if(!p){bad.push(`${it.id||it.name}: not in the canonical catalogue`);continue}
      const paid=Number(it.unit_price);
      if(p.anyPrice===true){
        const min=Number(p.minPrice)>0?Number(p.minPrice):0;
        if(!Number.isFinite(paid)||paid<=0)
          bad.push(`${p.name}: buyer-chosen amount is missing or not positive`);
        else if(paid<min)
          bad.push(`${p.name}: paid ${paid}, below the ${min} minimum`);
        else chosen++;
      }else if(Number(p.price)!==paid){
        bad.push(`${p.name}: charged ${it.unit_price}, catalogue says ${p.price}`)}
      if(p.noQuantity===true&&Number(it.quantity)!==1)
        bad.push(`${p.name}: quantity ${it.quantity}, but this item is sold singly`)}
    checks.push(line(bad.length===0,
      bad.length?"Item prices do NOT match the catalogue"
        :chosen?`Item prices match the catalogue (${chosen} buyer-chosen)`
        :"All item prices match the catalogue",
      bad.join("; ")));

    const failed=checks.some(c=>c.textContent.startsWith("✕"));
    out.replaceChildren(
      el("div",{class:failed?"note err":"note ok"},
        el("b",null,failed?"This order did not pass verification."
          :"This order is consistent with your canonical store."),
        el("span",{class:"body",text:failed
          ?"Do not fulfil it until you understand every failure below."
          :"Prices, destination and payment proof all line up."})),
      el("div",{class:"card"},...checks))};

  return el("div",null,
    el("p",{class:"sub"},
      "Paste an order a customer emailed you and check it against your published store. ",
      "This runs entirely in your browser."),
    el("div",{class:"card"},
      el("label",{class:"f"},el("span",{text:"Canonical config URL"}),
        el("div",{class:"hint"},"The raw config.json in your repo — not the GitHub HTML page."),
        urlIn),
      el("label",{class:"f"},el("span",{text:"Your lightning node ID (optional)"}),
        el("div",{class:"hint"},
          "The only field that proves a payment reached ",el("b",null,"you"),
          ". The node id is recovered from the invoice's own signature, so it cannot be forged. ",
          "Find it in your wallet, or use the button below to read it off an invoice you issue."),
        nodeIn,
        el("div",{style:"display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"},
          el("button",{class:"btn sec",type:"button",style:"padding:6px 12px;font-size:13px",
            onclick:async e=>{
              const btn=e.target;btn.textContent="Checking…";
              try{
                const params=await lnurlParams(cfg.store.lightningAddress);
                const probe=await lnurlInvoice(params,Math.max(Number(params.minSendable)||1000,1000),"node id probe");
                const {nodeId}=await payeeNodeId(probe.pr);
                nodeIn.value=nodeId;lsSet(NODE_KEY,nodeId);
                btn.textContent="Detected";
              }catch(err){
                btn.textContent="Couldn't detect";
                nodeHint.replaceChildren(el("div",{class:"note err"},
                  el("span",{class:"body",text:err.message})))}
              setTimeout(()=>{btn.textContent="Detect from my lightning address"},2500)}},
            "Detect from my lightning address"),
          el("button",{class:"btn sec",type:"button",style:"padding:6px 12px;font-size:13px",
            onclick:()=>{const v=nodeIn.value.trim().toLowerCase();
              if(v)lsSet(NODE_KEY,v); else lsDel(NODE_KEY)}},"Remember")),
        nodeHint),
      el("label",{class:"f"},el("span",{text:"Order JSON"}),orderIn),
      el("button",{class:"btn acc",onclick:run},"Verify order")),
    out)}

function adminProducts(d){
  const list=el("div",{class:"plist"});
  const redraw=()=>{
    list.replaceChildren(...d.products.map((p,i)=>el("div",{class:"pitem"},
      p.images?.[0]?el("img",{class:"thumb",src:p.images[0],alt:""}):el("div",{class:"thumb"}),
      el("div",{class:"info"},
        el("div",{class:"nm",text:p.name}),
        el("div",{style:"color:var(--muted);font-size:13px",
          text:(p.anyPrice
              ?"any price"+(p.minPrice>0?` from ${isSats()?fmtSats(p.minPrice):fmtFiat(p.minPrice)}`:"")
              :(isSats()?fmtSats(p.price):fmtFiat(p.price)))
            +(p.images?.length>1?` · ${p.images.length} images`:"")
            +(p.noQuantity?" · single":"")
            +(p.available===false?" · unavailable":"")})),
      el("button",{class:"iconbtn",title:"Move up",disabled:i===0,
        onclick:()=>{[d.products[i-1],d.products[i]]=[d.products[i],d.products[i-1]];saveDraft(d);redraw()}},"↑"),
      el("button",{class:"iconbtn",title:"Move down",disabled:i===d.products.length-1,
        onclick:()=>{[d.products[i+1],d.products[i]]=[d.products[i],d.products[i+1]];saveDraft(d);redraw()}},"↓"),
      el("button",{class:"iconbtn",title:"Edit",onclick:()=>editProduct(d,i,redraw)},"✎"),
      el("button",{class:"iconbtn",title:"Remove",onclick:()=>{
        if(confirm(`Remove "${p.name}"?`)){d.products.splice(i,1);saveDraft(d);redraw()}}},"✕"))));
    if(!d.products.length)list.append(el("p",{class:"sub",text:"No products yet."}))};
  redraw();
  return el("div",null,list,
    el("p",{style:"margin-top:18px"},
      el("button",{class:"btn acc",onclick:()=>editProduct(d,-1,redraw)},"Add product")))}

function editProduct(d,index,done){
  const p=index<0
    ?{id:crypto.randomUUID().slice(0,8),name:"",desc:"",price:0,images:[],available:true,

function shrinkImage(file,max=800){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read failed"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("decode failed"));
      img.onload=()=>{
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/webp",0.82))};
      img.src=fr.result};
    fr.readAsDataURL(file)})}

let manualAmount=null;             // ad-hoc charge, in the store's display units

/**
 * Keypad for charging an arbitrary amount — the first thing a cashier reaches
 * for when something is not in the catalogue. Digits are entered lowest-unit
 * first, the way a card terminal behaves.
 */
function viewKeypad(prefill=null){
  chrome();
  const sats=isSats();
  let digits=prefill!=null?String(Math.round(prefill*(sats?1:100))):"";

  const amtEl=el("div",{class:"pad-amt"});
  const satsEl=el("div",{class:"pad-sats"});
  const value=()=>{const n=Number(digits||"0");return sats?n:n/100};

  const draw=()=>{
    const v=value();
    amtEl.textContent=sats?fmtSats(v):fmtFiat(v);
    const s=sats?Math.round(v):unitSats({price:v});
    satsEl.textContent=sats?"":(s===null?"rate unavailable":"⚡ "+new Intl.NumberFormat().format(s));
    ok.disabled=!(v>0)||(!sats&&!rate)};

  const key=t=>el("button",{type:"button",onclick:()=>{
    if(t==="<")digits=digits.slice(0,-1);
    else if(digits.length<10)digits=(digits+t).replace(/^0+(?=\d)/,"");
    draw()}},t);

  const ok=el("button",{class:"btn acc",style:"background:var(--accent);color:var(--accent-ink)",
    onclick:()=>{
      const v=value();
      if(!(v>0))return;
      manualAmount=v;
      pendingCustomer={name:"In-person sale",email:"",phone:"",address:"",notes:""};
      go("#/cashier-pay")}},"Ok");

  draw();
  show(el("div",{class:"pad"},
    amtEl,satsEl,
    el("div",{class:"pad-keys"},
      ["1","2","3","4","5","6","7","8","9"].map(key),
      sats?key("000"):key("00"),key("0"),key("<")),
    el("div",{class:"pad-wide"},ok,
      el("button",{class:"btn sec",type:"button",onclick:()=>{manualAmount=null;go("#/cashier")}},"Cancel"))))}

function viewCashier(){
  chrome();
  const t=tillTotals();
  // Manual payment sits on its own above a divider: it is the thing a cashier
  // reaches for when nothing in the catalogue applies, not one of the items.
  const manualSection=el("div",{class:"cashier-manual"},
    el("div",{class:"grid"},
      el("button",{class:"prod",
        style:"cursor:pointer;text-align:left;border-width:2px;border-color:var(--accent)",
        onclick:()=>go("#/keypad")},
        el("div",{class:"body"},
          el("h3",{text:"Manual payment"}),
          el("div",{class:"price"},el("span",{text:"Any amount"})),
          el("div",{style:"color:var(--muted);font-size:13px",
            text:"Charge something not in the list"})))));

  const grid=el("div",{class:"grid"},cfg.products.map(p=>{
    const n=till[p.id]||0;
    return el("button",{class:"prod",style:"cursor:pointer;text-align:left;border-width:2px;"+
      (n?"border-color:var(--accent)":""),
      onclick:()=>{
        // An any-price item has no list price to tally, so it goes to the keypad.
        if(p.anyPrice)return viewKeypadFor(p);
        till[p.id]=(till[p.id]||0)+1;viewCashier()}},
      el("div",{class:"body"},
        el("h3",{text:p.name}),
        el("div",{class:"price"},el("span",{
          text:p.anyPrice?"Any amount":(isSats()?fmtSats(p.price):fmtFiat(p.price))})),
        n?el("div",{style:"font-weight:700;color:var(--accent)",text:`× ${n}`}):null))}));

  const lines=Object.entries(till).filter(([,n])=>n>0);
  const tally=el("div",{class:"card"},
    lines.length?lines.map(([id,n])=>{
      const p=findProduct(id);
      return el("div",{class:"line"},
        el("div",{class:"info"},el("div",{style:"font-weight:600",text:p?.name||id})),
        el("div",{class:"qty"},
          el("button",{onclick:()=>{till[id]=Math.max(0,n-1);if(!till[id])delete till[id];viewCashier()}},"−"),
          el("span",{text:String(n)}),
          el("button",{onclick:()=>{till[id]=n+1;viewCashier()}},"+")),
        el("div",{style:"min-width:96px;text-align:right",
          text:isSats()?fmtSats((p?.price||0)*n):fmtFiat((p?.price||0)*n)}))})
    :el("p",{class:"sub",style:"margin:0",text:"Tap items to add them."}),
    lines.length?el("div",{class:"totals grand"},el("span",null,"Total"),
      el("span",{text:t.priceable?fmtSats(t.sats):"rate unavailable"})):null);

  show(
    el("div",{style:"display:flex;align-items:center;gap:12px;flex-wrap:wrap"},
      el("h1",{text:"Cashier",style:"margin:0"}),
      el("span",{class:"soldout",text:"in-person sale"}),
      el("span",{class:"grow",style:"flex:1"}),
      el("button",{class:"ghost",onclick:()=>{till={};go("#/")}},"Exit")),
    el("p",{class:"sub",text:"Tap items to tally them, then take payment."}),
    manualSection,
    el("h2",{text:"Items"}),
    grid,
    el("h2",{text:"Tally"}),tally,
    el("div",{style:"display:flex;gap:10px;margin-top:18px"},
      lines.length?el("button",{class:"btn sec",onclick:()=>{till={};viewCashier()}},"Clear"):null,
      el("button",{class:"btn acc",disabled:!lines.length||!t.priceable,
        onclick:()=>{pendingCustomer={name:"In-person sale",email:"",phone:"",address:"",notes:""};
          go("#/cashier-pay")}},"Take payment")))}

let keypadPrefill=null;
const viewKeypadFor=p=>{keypadPrefill=p.anyPrice?null:p.price;go("#/keypad")};

function tillTotals(){
  // A manual charge is its own single line, so it flows through the ordinary
  // order pipeline and lands in the order JSON like anything else.
  if(manualAmount!=null)return{
    lines:[{id:"manual",qty:1,opts:{},price:manualAmount,
      product:{id:"manual",name:"Manual payment",price:manualAmount,anyPrice:false,options:[]}}],
    fiat:manualAmount,
    sats:unitSats({price:manualAmount})??0,
    ship:0,
    priceable:isSats()||Boolean(rate)};
  const lines=Object.entries(till).filter(([,n])=>n>0)
    .map(([id,qty])=>({id,qty,opts:{},product:findProduct(id)})).filter(l=>l.product);
  let fiat=0,sats=0,priceable=true;
  for(const l of lines){
    const u=unitSats(l.product);
    if(u===null)priceable=false; else sats+=u*l.qty;
    fiat+=linePrice(l)*l.qty}
  return{lines,fiat,sats,ship:0,priceable}}

/* ══════════════════════════════════════════════════════════════════════════
   ROUTER
   ══════════════════════════════════════════════════════════════════════════ */
const ROUTES={"#/":viewStore,"#/cart":viewCart,"#/checkout":viewCheckout,
  "#/pay":viewPay,"#/done":viewDone,"#/admin":viewAdmin,
  "#/cashier":viewCashier,"#/cashier-pay":viewPay,
  "#/keypad":()=>{const p=keypadPrefill;keypadPrefill=null;viewKeypad(p)}};
const go=hash=>{if(location.hash===hash)route(); else location.hash=hash};
function route(){
  stopTimers();
  (ROUTES[location.hash]||viewStore)()}

async function refreshRate(){
  rate=await fetchRate();chrome();
  // Give the retries a moment before the storefront is allowed to complain.
  setTimeout(()=>{
    if(rateChecked)return;
    rateChecked=true;
    if(!rate&&["#/","#/cart"].includes(location.hash||"#/"))route()},2000);
  // A cold network or one rate-limited source shouldn't leave the store unbuyable
  // until the visitor reloads. Retry quietly, then re-render if it lands.
  for(let i=0;!rate&&!isSats()&&i<2;i++){
    await new Promise(r=>setTimeout(r,1200*(i+1)));
    rate=await fetchRate();chrome();
    // only re-render views with no form state to lose
    if(rate&&["#/","#/cart"].includes(location.hash||"#/"))route();
  }
  rateChecked=true}

document.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="goPublish"){adminTab="publish";go("#/admin")}
  if(act==="discardDraft"&&confirm("Discard local changes and go back to the published store?")){
    lsDel(DRAFT_KEY);location.reload()}});
$("cartBtn").addEventListener("click",()=>go("#/cart"));
$("adminLink").addEventListener("click",()=>go("#/admin"));
window.addEventListener("hashchange",route);

/* Quadruple-tap the store icon to open the cashier. Deliberately undiscoverable
   rather than secret — it hides a staff tool from shoppers, nothing more. */
(function cashierGesture(){
  let taps=0,timer=null;
  $("brandIcon").addEventListener("click",e=>{
    e.preventDefault();
    taps++;
    clearTimeout(timer);
    timer=setTimeout(()=>{taps=0},700);
    if(taps>=4){taps=0;clearTimeout(timer);go("#/cashier")}});
})();

(async function boot(){
  loadCart();
  await loadConfig();
  await loadInventory();
  chrome();
  route();
  verifyStore();                 // never blocks the page
  await refreshRate();
  if(["#/","#/cart","#/checkout"].includes(location.hash||"#/"))route();
})();
</script>
