<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--
      The wallet moved to /sparknote/ when it was renamed. This stub keeps old
      links, bookmarks and QR codes working rather than 404ing them.

      No wallet data is affected by the move: IndexedDB is scoped to the origin,
      not the path, so the same wallet is there at the new address.

      An installed app pinned to this old path cannot be redirected — a PWA's
      identity is its URL — so it says so plainly rather than looking broken.
    -->
    <meta http-equiv="refresh" content="0; url=../sparknote/" />
    <link rel="canonical" href="../sparknote/" />
    <title>sparknote has moved</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #0c0d10; color: #e8e8ea; padding: 24px;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: #9a9aa2; font-size: .9375rem; }
      a {
        display: block; padding: 12px 16px; border-radius: 10px;
        background: #f7931a; color: #0c0d10; font-weight: 600; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This wallet is now called sparknote</h1>
      <p>
        It has moved to <strong>/sparknote/</strong>. Your wallet is unaffected — the same one is
        waiting at the new address. Update your bookmark, and reinstall the app from there if you
        added it to your home screen.
      </p>
      <a href="../sparknote/">Go to sparknote</a>
    </main>
  </body>
</html>
