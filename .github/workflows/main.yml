name: Sync VaultSend Offline to Index

on:
  push:
    paths:
      - 'vaultsend/VaultSend_offline.html'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy file if changed
        run: cp vaultsend/VaultSend_offline.html vaultsend/index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultsend/index.html
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git commit -m "Sync vaultsend/index.html from VaultSend_offline.html"
          git push
